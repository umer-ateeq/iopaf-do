# DigitalOcean App Platform spec for the IOPAF platform.
#
# Create with:   doctl apps create --spec .do/app.yaml
# Update with:   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Replace REPLACE_ME values before first deploy.

name: iopaf
region: fra          # pick the region nearest your assessors

# The custom domain is declared here so that applying this spec never
# silently removes it. A spec without a domains block deletes any domain
# added through the dashboard.
domains:
  - domain: iopaf.ovx-ai.com
    type: PRIMARY

services:
  - name: web
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1

    github:
      repo: umer-ateeq/iopaf-do
      branch: main
      deploy_on_push: true

    # DO's Node buildpack defaults to npm; this project requires pnpm 10.
    build_command: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Run node directly. `pnpm start` makes corepack download pnpm from npmjs
    # on every container start, which adds startup latency and fails the health
    # check whenever that fetch is slow or blocked. NODE_ENV is already set below.
    run_command: node dist/index.js

    http_port: 8080

    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 10
      failure_threshold: 5

    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

      # App Platform injects PORT. server/_core/index.ts now honours it verbatim.
      - key: PORT
        scope: RUN_TIME
        value: "8080"

      # Session signing secret. Set as an encrypted secret in the DO dashboard,
      # or via: doctl apps update <id> --spec (with type: SECRET)
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_GENERATE_A_LONG_RANDOM_STRING

      # ---- Auth provider ----
      # These were Manus-issued and will NOT work off-Manus.
      # They must be repointed at whichever provider replaces server/_core/sdk.ts.
      - key: VITE_APP_ID
        scope: RUN_AND_BUILD_TIME
        value: iopaf
      - key: OAUTH_SERVER_URL
        scope: RUN_TIME
        value: REPLACE_ME
      - key: VITE_OAUTH_PORTAL_URL
        scope: RUN_AND_BUILD_TIME
        value: REPLACE_ME

      - key: OWNER_OPEN_ID
        scope: RUN_TIME
        value: REPLACE_ME
      - key: OWNER_NAME
        scope: RUN_TIME
        value: REPLACE_ME

databases:
  - name: iopaf-db
    engine: MYSQL
    version: "8"
    production: true
    cluster_name: iopaf-db

      # ---- AI Copilot ----
      # One provider account serves every signed-in user. Server-only: it is
      # never sent to the browser, stored in the database or written into the
      # assessment file. Set it as an encrypted secret in the dashboard.
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_OPENAI_API_KEY

      # Optional. Point at an OpenAI-compatible gateway instead of OpenAI.
      # - key: OPENAI_BASE_URL
      #   scope: RUN_TIME
      #   value: https://api.openai.com/v1

      # Fallback model for users who have never opened Copilot Setup.
      - key: COPILOT_DEFAULT_MODEL
        scope: RUN_TIME
        value: gpt-4o-mini
