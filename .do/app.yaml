# DigitalOcean App Platform — $5/month tier, no managed database.
#
# server/db.ts creates the connection lazily and returns null when
# DATABASE_URL is absent; callers warn instead of throwing. The app therefore
# runs correctly with no database. Since the schema holds user accounts only,
# and sign-in cannot work until Manus OAuth is replaced, the database buys
# nothing yet — add it with .do/app-with-database.yaml when auth is live.
#
# Create:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <APP_ID> --spec .do/app.yaml

name: iopaf
region: fra                      # pick the region nearest your assessors

# The custom domain is declared here so that applying this spec never
# silently removes it. A spec without a domains block deletes any domain
# added through the dashboard.
domains:
  - domain: iopaf.ovx-ai.com
    type: PRIMARY

services:
  - name: web
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb   # $5/mo basic tier
    instance_count: 1

    github:
      repo: umer-ateeq/iopaf-do
      branch: main
      deploy_on_push: true

    # DO's Node buildpack defaults to npm; this project needs pnpm 10.
    build_command: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Run node directly. `pnpm start` makes corepack download pnpm from npmjs
    # on every container start, which adds startup latency and fails the health
    # check whenever that fetch is slow or blocked. NODE_ENV is already set below.
    run_command: node dist/index.js

    http_port: 8080

    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 10
      failure_threshold: 5

    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

      # App Platform injects PORT; server/_core/index.ts now honours it verbatim
      # instead of scanning for a free port.
      - key: PORT
        scope: RUN_TIME
        value: "8080"

      # Session signing secret. Generate a long random string and set it as an
      # encrypted secret in the dashboard, or keep type: SECRET here.
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_GENERATE_A_LONG_RANDOM_STRING

      # ---- Supabase (auth + Postgres) ----
      # Publishable key: safe to expose; it only identifies the project and
      # carries no privileges beyond what RLS allows.
      - key: SUPABASE_URL
        scope: RUN_TIME
        value: https://ydmzizulxcweiorcvbag.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        scope: RUN_TIME
        value: sb_publishable_flvh9YNP_dKfDQiV8iw7Mw_qQ6xyv4-
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
        value: https://ydmzizulxcweiorcvbag.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        scope: BUILD_TIME
        value: sb_publishable_flvh9YNP_dKfDQiV8iw7Mw_qQ6xyv4-

      # Postgres connection string from Supabase → Project Settings → Database.
      # Contains the database password, so it must be set as an encrypted
      # secret. Login cannot work until this is populated.
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_ME_SUPABASE_POSTGRES_CONNECTION_STRING

      # ---- Auth provider ----
      # These were Manus-issued and do NOT work off-Manus. Until
      # server/_core/sdk.ts is repointed at a real provider, the public site
      # renders but nobody can sign in and /app.html stays behind a 302.
      - key: VITE_APP_ID
        scope: RUN_AND_BUILD_TIME
        value: iopaf
      - key: OAUTH_SERVER_URL
        scope: RUN_TIME
        value: REPLACE_ME
      - key: VITE_OAUTH_PORTAL_URL
        scope: RUN_AND_BUILD_TIME
        value: REPLACE_ME

      - key: OWNER_OPEN_ID
        scope: RUN_TIME
        value: REPLACE_ME
      - key: OWNER_NAME
        scope: RUN_TIME
        value: REPLACE_ME
