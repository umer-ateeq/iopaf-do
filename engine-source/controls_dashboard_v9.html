.cd-tile{position:relative;min-height:112px;border:1px solid #d3dee6;background:#fff;padding:9px 8px 8px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;overflow:hidden}.cd-tile:hover,.cd-tile:focus-visible{border-color:#0e8a7d;box-shadow:0 5px 14px rgba(14,138,125,.14);transform:translateY(-1px);outline:none}.cd-tile:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#74879a}.cd-tile[data-class="Critical"]:before{background:#a82b3a}.cd-tile[data-class="Core"]:before{background:#0e8a7d}.cd-tile.na-target{opacity:.52;background:#f4f6f8}.cd-tile-top{display:flex;justify-content:space-between;align-items:center;gap:5px}.cd-id{font-family:var(--mono);font-size:8.5px;font-weight:800;color:#0b2e52}.cd-class{font-family:var(--mono);font-size:6.8px;font-weight:800;letter-spacing:.04em;color:#667b8d}.cd-tile[data-class="Critical"] .cd-class{color:#a82b3a}.cd-tile[data-class="Core"] .cd-class{color:#08756b}.cd-name{font-size:9px;line-height:1.3;color:#29475e;font-weight:700;margin:6px 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.cd-tile-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:7px;margin-top:auto}.cd-level{font-family:var(--disp);font-size:20px;line-height:1;color:#7a8b99}.cd-level.L0,.cd-level.L1{color:#a82b3a}.cd-level.L2{color:#775da8}.cd-level.L3{color:#2f6fa3}.cd-level.L4,.cd-level.L5{color:#0e8a7d}.cd-level.na{font-size:13px}.cd-state{text-align:right}.cd-state b{display:block;font-family:var(--mono);font-size:6.8px;color:#6e8294}.cd-state span{display:block;font-size:7.5px;color:#748797;margin-top:2px}.cd-cap{color:#a82b3a!important;font-weight:800}.cd-none{padding:26px;border:1px dashed #bdccd7;background:#f8fafb;text-align:center;color:#64798b}.cd-methodology{margin:0 18px 18px;border:1px solid #cbd9e3;background:#f7fafb;padding:10px 12px}.cd-methodology summary{cursor:pointer;font-weight:800;color:#173b55;font-size:1 </style>
<script>
(function(){
  const CLASS_ORDER=['Critical','Core','Non-critical'];
  const state={q:'',domain:'all',group:'all',cls:'all',maturity:'all',evidence:'all'};
  const baseRenderResults=renderResults;
  function esc(v){return v9esc(v)}
  function classification(c){if(Number(c.w)>=3)return 'Critical';return (c.fw||[]).length>=2?'Core':'Non-critical'}
  function classReason(c){const cls=classification(c);return cls==='Critical'?'Portal weight 3 · high-priority control':cls==='Core'?`Portal weight 2 · ${(c.fw||[]).length} source frameworks`:'Portal weight 2 · one source framework'}
  function result(c,oid){const obj=iamObject(oid)||iamDefaultObject(),applies=iamControlApplies(c,obj),r=iamGetResponse(oid,c.id);if(!applies)return {kind:'target-na',label:'TARGET N/A',level:null,raw:null,capped:false,evidenced:false,r};if(r.implementation==='na')return {kind:'na',label:'N/A',level:null,raw:null,capped:false,evidenced:r.evidence!=='none',r};if(r.maturity===null)return {kind:'unassessed',label:'—',level:null,raw:null,capped:false,evidenced:r.evidence!=='none',r};const raw=Number(r.maturity),evidenced=r.evidence!=='none';let level=raw,capped=false;if(!evidenced&&raw>=c.ev){level=Math.max(0,c.ev-1);capped=true}return {kind:'level',label:'L'+level,level,raw,capped,evidenced,r};}
  function targetOptions(){if(!iamObjects.length)iamObjects=[iamDefaultObject()];return iamObjects.map(o=>`<option value="${esc(o.id)}" ${o.id===iamSelectedObject?'selected':''}>${esc(o.name)} · ${esc(iamObjectType(o.type).name)}</option>`).join('')}
  function ensureState(){iamRiskState.controlDashboard=Object.assign({q:'',domain:'all',group:'all',cls:'all',maturity:'all',evidence:'all'},iamRiskState.controlDashboard||{});Object.assign(state,iamRiskState.controlDashboard)}
  function counts(records){const out={rated:0,evidenced:0,gaps:0,criticalGaps:0,capped:0,applicable:0,na:0,unassessed:0,levels:[0,0,0,0,0,0],classes:{Critical:0,Core:0,'Non-critical':0}};records.forEach(x=>{out.classes[x.cls]++;if(x.res.kind==='target-na')return;out.applicable++;if(x.res.kind==='na'){out.na++;return}if(x.res.level===null){out.unassessed++;return}out.rated++;out.levels[x.res.level]++;if(x.res.evidenced)out.evidenced++;if(x.res.level<4){out.gaps++;if(x.cls==='Critical')out.criticalGaps++}if(x.res.capped)out.capped++});return out}
  function records(){return IAMCTL.map(c=>({c,cls:classification(c),reason:classReason(c),res:result(c,iamSelectedObject)}))}
  function maturityKey(x){return x.res.kind==='level'?'L'+x.res.level:x.res.kind}
  function evidenceKey(x){return x.res.res&&x.res.r.evidence!=='none'?'evidenced':x.res.r&&x.res.r.evidence!=='none'?'evidenced':'missing'}
  function tile(x){const c=x.c,r=x.res,ev=r.evidenced?'Evidenced':'No evidence',meta=r.kind==='target-na'?'Not applicable to this target':r.kind==='na'?'Recorded N/A':r.kind==='unassessed'?'Unassessed':r.capped?`Claimed L${r.raw} · capped`:`Effective ${r.label}`,assurance=r.level===null?0:Math.round((r.level/5)*75+(r.evidenced?25:0));return `<button class="cd-tile ${r.kind==='target-na'?'na-target':''}" data-id="${c.id}" data-domain="${c.d}" data-group="${esc(c.g)}" data-class="${x.cls}" data-maturity="${maturityKey(x)}" data-evidence="${r.evidenced?'evidenced':'missing'}" data-search="${esc((c.id+' '+c.s+' '+c.src+' '+c.g).toLowerCase())}" onclick="IOPAF_DASH.open('${c.id}')" aria-label="Open ${c.id}, ${esc(c.s)}, ${x.cls}, ${esc(meta)}" title="${esc(c.s+' · '+x.reason)}"><div class="cd-tile-top"><span class="cd-id">${c.id}</span><span class="cd-class">${x.cls.toUpperCase()}</span></div><div class="cd-name">${esc(c.s)}</div><div class="cd-tile-bottom"><span class="cd-level ${r.level===null?'na':'L'+r.level}">${esc(r.label)}</span><span class="cd-state"><b class="${r.capped?'cd-cap':''}">${esc(meta)}</b><span>${ev} · Gate L${c.ev}</span></span></div><div class="cd-assurance-bar" title="Evidence-gated maturity signal"><i style="width:${assurance}%"></i></div></button>`}

  function commandHTML(rec){const s=counts(rec),obj=iamObject(iamSelectedObject)||iamDefaultObject(),evidenceRate=s.rated?Math.round(s.evidenced/s.rated*100):0,mode=s.levels.reduce((best,n,i)=>n>best.n?{n,i}:best,{n:-1,i:0}),modeText=s.rated?`Most common assessed state: L${mode.i}`:'No maturity state established yet';return `<section class="cd-command"><div class="cd-command-hd"><b>CONNECTED ASSURANCE PATH</b><span>Target → evidence-gated estate → priority exposure → accountable assessment</span></div><div class="cd-path"><div class="cd-path-node"><label>01 · DECISION TARGET</label><b>${esc(obj.name)}</b><span>${s.applicable} applicable controls</span></div><div class="cd-path-arrow">→</div><div class="cd-path-node assure"><label>02 · EVIDENCE & MATURITY</label><b>${s.rated} rated · ${evidenceRate}% evidenced</b><span>${modeText}</span></div><div class="cd-path-arrow">→</div><div class="cd-path-node decision"><label>03 · PRIORITY EXPOSURE</label><b>${s.criticalGaps} critical gaps</b><span>${s.gaps} total below L4 · ${s.capped} capped</span></div><div class="cd-path-arrow">→</div><div class="cd-path-node assure"><label>04 · DECISION / ACTION</label><b>Open a control node</b><span>Review evidence, posterior and owner</span></div></div></section>`}
  function dashboardHTML(){ensureState();const rec=records(),s=counts(rec),domainOptions=IAM_DOMAINS.map(d=>`<option value="${d.c}" ${state.domain===d.c?'selected':''}>${d.c} · ${esc(d.name)}</option>`).join(''),groups=[...new Set(IAMCTL.map(c=>c.g))].sort(),groupOptions=groups.map(g=>`<option value="${esc(g)}" ${state.group===g?'selected':''}>${esc(g)}</option>`).join(''),dist=[...s.levels.map((n,i)=>['L'+i,n]),['Unassessed',s.unassessed],['N/A',s.na]];return `<div class="cd-shell"><section class="cd-hero"><div><div class="cd-ey">CONTROL ESTATE · 148-POINT MATURITY MAP</div><h3>Controls Dashboard</h3><p>One holistic view of every IAM control. Classification sets relative assurance priority; the maturity shown is the evidence-gated effective L0–L5 result for the selected assessment target.</p></div><div class="cd-target"><label>ASSESSMENT TARGET</label><select onchange="IOPAF_DASH.target(this.value)">${targetOptions()}</select></div></section><section class="cd-kpis"><div class="cd-kpi"><label>CONTROL ESTATE</label><b>148</b><span>${s.applicable} applicable to this target</span></div><div class="cd-kpi critical"><label>CRITICAL</label><b>${s.classes.Critical}</b><span>weight 3 · high priority</span></div><div class="cd-kpi core"><label>CORE</label><b>${s.classes.Core}</b><span>multi-framework foundation</span></div><div class="cd-kpi support"><label>NON-CRITICAL</label><b>${s.classes['Non-critical']}</b><span>supporting · still required</span></div><div class="cd-kpi"><label>RATED / EVIDENCED</label><b>${s.rated} / ${s.evidenced}</b><span>${s.capped} evidence-gated caps</span></div><div class="cd-kpi gap"><label>BELOW L4</label><b>${s.gaps}</b><span>effective maturity gaps</span></div></section><section class="cd-dist"><div class="cd-dist-title"><b>Effective maturity distribution</b><span>UNASSESSED ≠ L0</span></div><div class="cd-dist-bars">${dist.map(x=>`<div class="cd-dist-cell" data-level="${x[0]}"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div></section><section class="cd-filters"><div class="cd-filter"><label>SEARCH CONTROL</label><input type="search" value="${esc(state.q)}" oninput="IOPAF_DASH.filter('q',this.value)" placeholder="ID, name, source or group"></div><div class="cd-filter"><label>DOMAIN</label><select onchange="IOPAF_DASH.filter('domain',this.value)"><option value="all">All domains</option>${domainOptions}</select></div><div class="cd-filter"><label>GROUP</label><select onchange="IOPAF_DASH.filter('group',this.value)"><option value="all">All groups</option>${groupOptions}</select></div><div class="cd-filter"><label>CLASSIFICATION</label><select onchange="IOPAF_DASH.filter('cls',this.value)"><option value="all">All classes</option>${CLASS_ORDER.map(x=>`<option ${state.cls===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="cd-filter"><label>MATURITY</label><select onchange="IOPAF_DASH.filter('maturity',this.value)"><option value="all">All maturity</option><option value="unassessed">Unassessed</option><option value="na">Recorded N/A</option><option value="target-na">Target N/A</option>${[0,1,2,3,4,5].map(x=>`<option value="L${x}" ${state.maturity==='L'+x?'selected':''}>L${x}</option>`).join('')}</select></div><div class="cd-filter"><label>EVIDENCE</label><select onchange="IOPAF_DASH.filter('evidence',this.value)"><option value="all">All evidence</option><option value="evidenced">Evidenced</option><option value="missing">Missing evidence</option></select></div><button class="cd-reset" onclick="IOPAF_DASH.reset()">Reset filters</button><div class="cd-filter-result"><span><b id="cd-visible">148</b> controls shown · click a tile to assess it</span><span class="cd-method" onclick="document.getElementById('cd-method')?.setAttribute('open','')">CLASSIFICATION METHOD →</span></div></section><div class="cd-estate">${IAM_DOMAINS.map(d=>{const rows=rec.filter(x=>x.c.d===d.c),dc=counts(rows),groups=[...new Set(rows.map(x=>x.c.g))];return `<section class="cd-domain" data-domain-section="${d.c}"><header class="cd-domain-hd"><span class="cd-domain-code">${d.c}</span><div><h4>${esc(d.name)}</h4><p>${esc(d.q)}</p></div><div class="cd-domain-stat"><b>${dc.rated}/${dc.applicable}</b><span>RATED · ${dc.gaps} BELOW L4</span></div></header><div class="cd-groups">${groups.map(g=>{const gr=rows.filter(x=>x.c.g===g);return `<section class="cd-group"><div class="cd-group-hd"><b>${esc(g)}</b><span>${gr.length} controls</span></div><div class="cd-grid">${gr.map(tile).join('')}</div></section>`}).join('')}</div></section>`}).join('')}<div class="cd-none" hidden>No controls match the selected filters.</div></div><details id="cd-method" class="cd-methodology"><summary>How Core, Critical and Non-critical are assigned</summary><p><strong>Critical:</strong> portal weight 3. <strong>Core:</strong> weight 2 and mapped to at least two source frameworks. <strong>Non-critical:</strong> weight 2 and mapped to one source framework. Classification does not change with maturity or evidence. Non-critical means lower relative priority—not optional or out of scope.</p></details></div>`}
  function ensurePanel(){const tabs=document.querySelector('.res-tabs');if(!tabs)return;let btn=document.querySelector('[data-panel="panel-controls-dashboard"]');if(!btn){btn=document.createElement('button');btn.className='res-tab';btn.dataset.panel='panel-controls-dashboard';btn.setAttribute('role','tab');btn.setAttribute('aria-selected','false');btn.textContent='Controls dashboard';btn.onclick=function(){resTab(btn);render()};const iamBtn=document.querySelector('[data-panel="panel-iam"]');iamBtn?iamBtn.insertAdjacentElement('afterend',btn):tabs.appendChild(btn)}let panel=document.getElementById('panel-controls-dashboard');if(!panel){panel=document.createElement('div');panel.className='res-panel';panel.id='panel-controls-dashboard';const iamPanel=document.getElementById('panel-iam');iamPanel?iamPanel.insertAdjacentElement('afterend',panel):document.querySelector('.res-wrap')?.appendChild(panel)}}
  function render(){ensurePanel();const panel=document.getElementById('panel-controls-dashboard');if(!panel)return;panel.innerHTML=dashboardHTML();panel.querySelector('.cd-filters')?.insertAdjacentHTML('beforebegin',commandHTML(records()));panel.querySelectorAll('.cd-group').forEach(g=>{const tiles=[...g.querySelectorAll('.cd-tile')];if(tiles.filter(x=>x.dataset.class==='Critical').length>=Math.ceil(tiles.length/2))g.classList.add('priority')});apply()}
  function apply(){const q=state.q.trim().toLowerCase();let visible=0;document.querySelectorAll('#panel-controls-dashboard .cd-tile').forEach(el=>{const ok=(!q||el.dataset.search.includes(q))&&(state.domain==='all'||el.dataset.domain===state.domain)&&(state.group==='all'||el.dataset.group===state.group)&&(state.cls==='all'||el.dataset.class===state.cls)&&(state.maturity==='all'||el.dataset.maturity===state.maturity)&&(state.evidence==='all'||el.dataset.evidence===state.evidence);el.hidden=!ok;if(ok)visible++});document.querySelectorAll('#panel-controls-dashboard .cd-group').forEach(el=>el.hidden=!el.querySelector('.cd-tile:not([hidden])'));document.querySelectorAll('#panel-controls-dashboard .cd-domain').forEach(el=>el.hidden=!el.querySelector('.cd-tile:not([hidden])'));const count=document.getElementById('cd-visible');if(count)count.textContent=visible;const none=document.querySelector('#panel-controls-dashboard .cd-none');if(none)none.hidden=visible!==0;iamRiskState.controlDashboard=Object.assign({},state);persist()}
  function filter(k,v){state[k]=v;apply()}
  function reset(){Object.assign(state,{q:'',domain:'all',group:'all',cls:'all',maturity:'all',evidence:'all'});iamRiskState.controlDashboard=Object.assign({},state);render()}
  function target(id){if(!iamObject(id))return;iamSelectedObject=id;iamRiskState.objectId=id;persist();render()}
  function openControl(id){const c=iamCtl(id);if(!c)return;iamSelectedControl=id;iamRiskState.controlsUI=Object.assign({view:'focus',domain:c.d,control:id,missingEvidence:false},iamRiskState.controlsUI||{},{view:'focus',domain:c.d,control:id});persist();go('controls');renderControls();setTimeout(()=>document.querySelector('.cw-head')?.scrollIntoView({behavior:'smooth',block:'start'}),60)}
  renderResults=function(){baseRenderResults();ensurePanel();const active=document.getElementById('panel-controls-dashboard');if(active&&active.classList.contains('active'))render()};
  globalThis.IOPAF_DASH={render,filter,reset,target,open:openControl,classify:classification,result};
  ensurePanel();
  const params=new URLSearchParams(location.search);if(params.get('dashboard')==='controls')setTimeout(()=>{go('results');ensurePanel();const b=document.querySelector('[data-panel="panel-controls-dashboard"]');if(b){resTab(b);render()}},120);
})();
