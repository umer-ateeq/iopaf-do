<script>
(function(){
  const DATA=globalThis.IOPAF_CONTROL_TAXONOMY;
  if(!DATA||!globalThis.IOPAF_DASH)return;
  const TYPES=['Preventive','Detective','Corrective','Recovery','Directive','Deterrent','Compensating'];
  const HIERARCHIES=['Elimination','Substitution','Engineering','Administrative','PPE','Not applicable'];
  const EFFECTS=['Likelihood','Consequence','Both'];
  const REL_LABEL={enables:'ENABLES',requires:'REQUIRES',supplies_evidence:'SUPPLIES EVIDENCE',detects_failure:'DETECTS FAILURE',triggers_correction:'TRIGGERS CORRECTION',validates:'VALIDATES',shared_dependency:'SHARED DEPENDENCY'};
  const esc=v9esc;
  let taxState,deepApplied=false;
  function ensureState(){
    iamRiskState.controlTaxonomyDashboard=Object.assign({view:'estate',type:'all',hierarchy:'all',effect:'all',selected:'D1-01',depth:1},iamRiskState.controlTaxonomyDashboard||{});
    taxState=iamRiskState.controlTaxonomyDashboard;
    if(!DATA.controls[taxState.selected])taxState.selected='D1-01';
  }
  function meta(id){return DATA.controls[id]||{type:'Unknown',hierarchy:'Unknown',effect:'Unknown',upstream:[],downstream:[]}}
  function ctl(id){return iamCtl(id)}
  function maturity(id){const c=ctl(id);return c?IOPAF_DASH.result(c,iamSelectedObject):{kind:'unassessed',label:'—',level:null,evidenced:false,capped:false}}
  function priority(id){const c=ctl(id);return c?IOPAF_DASH.classify(c):'Unknown'}
  function options(list,current){return list.map(x=>`<option value="${esc(x)}" ${current===x?'selected':''}>${esc(x)}</option>`).join('')}
  function countChips(counter,kind){const order=kind==='type'?TYPES:kind==='hierarchy'?HIERARCHIES:EFFECTS;return order.map((name,i)=>`<span class="ctax-count ${i%3===0?'teal':i%3===1?'navy':'grey'}"><b>${counter[name]||0}</b>${esc(name)}</span>`).join('')}
  function taxonomySummary(){const m=DATA.metadata;return `<section class="ctax-summary"><div class="ctax-summary-block"><label>CONTROL FUNCTION / TYPE · PRIMARY ROLE</label><div class="ctax-counts">${countChips(m.control_type_counts,'type')}</div></div><div class="ctax-summary-block"><label>ADAPTED HIERARCHY · NIOSH-BASED</label><div class="ctax-counts">${countChips(m.adapted_hierarchy_counts,'hierarchy')}</div></div><div class="ctax-summary-block"><label>RISK EFFECT · CAUSAL INFLUENCE</label><div class="ctax-counts">${countChips(m.risk_effect_counts,'effect')}</div></div></section>`}
  function modeBar(){return `<section class="ctax-mode"><div class="ctax-mode-left"><button class="${taxState.view==='estate'?'on':''}" onclick="IOPAF_DASH_TAX.view('estate')">148-control estate</button><button class="${taxState.view==='dependencies'?'on':''}" onclick="IOPAF_DASH_TAX.view('dependencies')">Control interdependencies</button></div><div class="ctax-mode-actions"><span style="font-family:var(--mono);font-size:7px;color:#6a8091">${DATA.metadata.edge_count} DIRECTIONAL DEPENDENCIES · 148 CONTROLS</span><button class="ctax-export" onclick="IOPAF_DASH_TAX.exportCSV()">Export taxonomy CSV</button></div></section>`}
  function replaceTile(btn){
    if(btn.classList.contains('ctax-upgraded'))return btn;
    const id=btn.dataset.id,t=meta(id),article=document.createElement('article');
    [...btn.attributes].forEach(a=>article.setAttribute(a.name,a.value));
    article.className=btn.className+' ctax-upgraded';article.innerHTML=btn.innerHTML;article.setAttribute('role','button');article.tabIndex=0;article.removeAttribute('onclick');
    article.dataset.type=t.type;article.dataset.hierarchy=t.hierarchy;article.dataset.effect=t.effect;
    const r=maturity(id);article.dataset.assurance=r.kind==='unassessed'||r.kind==='target-na'||r.kind==='na'?'neutral':!r.evidenced?'provisional':r.level>=4?'assured':'gap';
    article.onclick=e=>{if(e.target.closest('.cd-dep-row button'))return;IOPAF_DASH.open(id)};
    article.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();IOPAF_DASH.open(id)}};
    const bottom=article.querySelector('.cd-tile-bottom');
    bottom?.insertAdjacentHTML('beforebegin',`<div class="cd-tax-row"><div class="cd-tax-chip"><label>CONTROL TYPE</label><b title="${esc(t.typeReason)}">${esc(t.type)}</b></div><div class="cd-tax-chip"><label>ADAPTED HIERARCHY</label><b title="${esc(t.hierarchyReason)}">${esc(t.hierarchy)}</b></div><div class="cd-tax-chip effect"><label>RISK EFFECT</label><b title="${esc(t.effectReason)}">${esc(t.effect)}</b></div></div>`);
    article.insertAdjacentHTML('beforeend',`<div class="cd-dep-row"><span>${t.upstream.length}↑ upstream · ${t.downstream.length}↓ downstream</span><button type="button" onclick="event.stopPropagation();IOPAF_DASH_TAX.select('${id}')">OPEN MAP →</button></div>`);
    btn.replaceWith(article);return article;
  }
  function addFilters(panel){
    const filters=panel.querySelector('.cd-filters');if(!filters)return;
    filters.classList.add('ctax-filters');
    if(!filters.querySelector('[data-tax-filter="type"]')){
      const reset=filters.querySelector('.cd-reset');
      reset.insertAdjacentHTML('beforebegin',`<div class="cd-filter"><label>CONTROL TYPE</label><select data-tax-filter="type" onchange="IOPAF_DASH_TAX.filter('type',this.value)"><option value="all">All types</option>${options(TYPES,taxState.type)}</select></div><div class="cd-filter"><label>ADAPTED HIERARCHY</label><select data-tax-filter="hierarchy" onchange="IOPAF_DASH_TAX.filter('hierarchy',this.value)"><option value="all">All hierarchy</option>${options(HIERARCHIES,taxState.hierarchy)}</select></div><div class="cd-filter"><label>RISK EFFECT</label><select data-tax-filter="effect" onchange="IOPAF_DASH_TAX.filter('effect',this.value)"><option value="all">All effects</option>${options(EFFECTS,taxState.effect)}</select></div>`);
    }
  }
  function baseMatch(el){const s=iamRiskState.controlDashboard||{},q=(s.q||'').trim().toLowerCase();return (!q||el.dataset.search.includes(q))&&(!s.domain||s.domain==='all'||el.dataset.domain===s.domain)&&(!s.group||s.group==='all'||el.dataset.group===s.group)&&(!s.cls||s.cls==='all'||el.dataset.class===s.cls)&&(!s.maturity||s.maturity==='all'||el.dataset.maturity===s.maturity)&&(!s.evidence||s.evidence==='all'||el.dataset.evidence===s.evidence)}
  function applyCombined(){const panel=document.getElementById('panel-controls-dashboard');if(!panel)return;let visible=0;panel.querySelectorAll('.cd-tile').forEach(el=>{const ok=baseMatch(el)&&(taxState.type==='all'||el.dataset.type===taxState.type)&&(taxState.hierarchy==='all'||el.dataset.hierarchy===taxState.hierarchy)&&(taxState.effect==='all'||el.dataset.effect===taxState.effect);el.hidden=!ok;if(ok)visible++});panel.querySelectorAll('.cd-group').forEach(el=>el.hidden=!el.querySelector('.cd-tile:not([hidden])'));panel.querySelectorAll('.cd-domain').forEach(el=>el.hidden=!el.querySelector('.cd-tile:not([hidden])'));const count=document.getElementById('cd-visible');if(count)count.textContent=visible;const none=panel.querySelector('.cd-none');if(none)none.hidden=visible!==0;iamRiskState.controlTaxonomyDashboard=Object.assign({},taxState);persist()}
  function relationNode(item,side,hop){const c=ctl(item.id),t=meta(item.id),r=maturity(item.id);if(!c)return '';return `<article class="ctax-node ${hop>1?'indirect':''}" role="button" tabindex="0" onclick="IOPAF_DASH_TAX.select('${item.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();IOPAF_DASH_TAX.select('${item.id}')}" title="Select ${item.id}"><div class="ctax-node-top"><span class="ctax-node-id">${item.id}</span><span class="ctax-rel">${esc(REL_LABEL[item.relation]||item.relation)}${hop>1?' · '+hop+' HOPS':''}</span></div><strong>${esc(c.s)}</strong><p>${esc(item.rationale)}</p><div class="ctax-node-foot"><span>${esc(t.type)} · ${esc(t.effect)}</span><span>${esc(r.label)} · ${priority(item.id)}</span></div></article>`}
  function walk(id,direction,depth){const seen=new Set([id]),out=[],q=[{id,hop:0}];while(q.length){const cur=q.shift();if(cur.hop>=depth)continue;for(const edge of meta(cur.id)[direction]||[]){if(seen.has(edge.id))continue;seen.add(edge.id);const item=Object.assign({},edge,{hop:cur.hop+1});out.push(item);q.push({id:edge.id,hop:cur.hop+1})}}return out}
  function scenario(id){return globalThis.IOPAF_RISK_LIVE?IOPAF_RISK_LIVE.scenarioForControl(id):null}
  function dependencyMap(){
    const id=taxState.selected,c=ctl(id)||IAMCTL[0],t=meta(c.id),r=maturity(c.id),up=walk(c.id,'upstream',taxState.depth),down=walk(c.id,'downstream',taxState.depth),upDirect=t.upstream.length,downDirect=t.downstream.length,shared=[...up,...down].filter(x=>x.relation==='shared_dependency').length,s=scenario(c.id),limit=30,upShown=up.slice(0,limit),downShown=down.slice(0,limit);
    const selectOptions=IAMCTL.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.id} · ${esc(x.s)}</option>`).join('');
    return `<section class="ctax-map"><header class="ctax-map-head"><div><div class="ey">CONTROL INTERDEPENDENCY · OPERATIONAL AND EVIDENCE RELATIONSHIPS</div><h4>Upstream and downstream assurance map</h4><p>Select a control to see what enables it, what evidence it consumes, which controls depend on it, and the Bayesian risk scenario it influences. These are documented operational dependencies—not inferred causality from domain proximity.</p></div><div class="ctax-map-controls"><div class="ctax-map-control"><label>FOCUS CONTROL</label><select onchange="IOPAF_DASH_TAX.select(this.value)">${selectOptions}</select></div><button class="${taxState.depth===1?'on':''}" onclick="IOPAF_DASH_TAX.depth(1)">Immediate</button><button class="${taxState.depth===2?'on':''}" onclick="IOPAF_DASH_TAX.depth(2)">Extend 2 hops</button></div></header><div class="ctax-metrics"><div class="ctax-metric"><label>DIRECT UPSTREAM</label><b>${upDirect}</b><span>immediate prerequisites</span></div><div class="ctax-metric"><label>DIRECT DOWNSTREAM</label><b>${downDirect}</b><span>immediate dependants</span></div><div class="ctax-metric"><label>${taxState.depth}-HOP UPSTREAM</label><b>${up.length}</b><span>visible upstream reach</span></div><div class="ctax-metric"><label>${taxState.depth}-HOP DOWNSTREAM</label><b>${down.length}</b><span>visible downstream reach</span></div><div class="ctax-metric"><label>SHARED DEPENDENCIES</label><b>${shared}</b><span>common services or sources</span></div></div><div class="ctax-graph"><section class="ctax-lane"><header class="ctax-lane-hd"><b>01 · UPSTREAM MEASURES</b><span>${up.length} linked</span></header><div class="ctax-node-list">${upShown.length?upShown.map(x=>relationNode(x,'upstream',x.hop)).join(''):'<div class="ctax-empty">No direct upstream control is required.</div>'}</div>${up.length>limit?`<div class="ctax-more">${limit} shown of ${up.length}; select a nearer node to continue tracing.</div>`:''}</section><div class="ctax-arrow-lane"><span>→</span></div><section class="ctax-focus"><div class="ctax-focus-top"><span class="ctax-focus-id">${c.id}</span><span class="ctax-focus-priority">${priority(c.id).toUpperCase()} · ${esc(r.label)}</span></div><h5>${esc(c.s)}</h5><div class="scope">${esc(c.d)} · ${esc(c.g)} · ${esc((iamObject(iamSelectedObject)||iamDefaultObject()).name)}</div><div class="ctax-focus-grid"><div class="ctax-focus-field"><label>CONTROL TYPE</label><b>${esc(t.type)}</b></div><div class="ctax-focus-field"><label>ADAPTED HIERARCHY</label><b>${esc(t.hierarchy)}</b></div><div class="ctax-focus-field"><label>RISK EFFECT</label><b>${esc(t.effect)}</b></div></div><div class="ctax-focus-reason"><b>WHY THIS CLASSIFICATION</b><span>${esc(t.typeReason)} ${esc(t.hierarchyReason)} ${esc(t.effectReason)}</span></div><div class="ctax-focus-reason"><b>AFFECTED RISK SCENARIO</b><span>${s?esc(s.id+' · '+s.name):'No live risk scenario is available.'}</span></div><div class="ctax-focus-actions"><button class="primary" onclick="IOPAF_DASH.open('${c.id}')">Open assessment</button>${s?`<button onclick="IOPAF_RISK_LIVE.open('${s.id}','network')">View Bayesian scenario</button>`:''}</div></section><div class="ctax-arrow-lane"><span>→</span></div><section class="ctax-lane"><header class="ctax-lane-hd"><b>03 · DOWNSTREAM MEASURES</b><span>${down.length} linked</span></header><div class="ctax-node-list">${downShown.length?downShown.map(x=>relationNode(x,'downstream',x.hop)).join(''):'<div class="ctax-empty">No direct downstream control depends on this measure.</div>'}</div>${down.length>limit?`<div class="ctax-more">${limit} shown of ${down.length}; select a nearer node to continue tracing.</div>`:''}</section></div><div class="ctax-legend">${Object.entries(REL_LABEL).map(([k,v])=>`<span><b>${esc(v)}</b> · ${esc({enables:'supplies a capability',requires:'depends on a prerequisite',supplies_evidence:'provides test evidence',detects_failure:'finds another control failure',triggers_correction:'starts remediation',validates:'independently confirms operation',shared_dependency:'relies on a common service'}[k])}</span>`).join('')}</div></section>`
  }
  function methodology(){return `<details class="ctax-method"><summary>How function, hierarchy, effect and interdependency are assigned</summary><div class="ctax-method-body"><div><b>Control function</b>One primary role: Preventive, Detective, Corrective, Recovery, Directive, Deterrent or Compensating. A primary label keeps dashboard filters mutually exclusive.</div><div><b>Adapted hierarchy</b>NIOSH terms are used literally. Engineering means technically enforced; Administrative means process or oversight; Elimination removes the risky mechanism; Substitution replaces it with a safer one. PPE is not used metaphorically for IAM.</div><div><b>Risk effect and dependencies</b>Likelihood, Consequence or Both reflects causal risk influence. Dependency edges require a documented operational, evidence or validation relationship; sharing a domain alone is insufficient.</div></div></details>`}
  function addDomainTraces(panel){panel.querySelectorAll('.cd-domain').forEach(sec=>{if(sec.querySelector('.ctax-domain-trace'))return;const code=sec.dataset.domainSection,tiles=[...sec.querySelectorAll('.cd-tile')],evidenced=tiles.filter(x=>x.dataset.evidence==='evidenced').length,gaps=tiles.filter(x=>x.dataset.assurance==='gap'||x.dataset.assurance==='provisional').length,first=tiles[0]?.dataset.id,s=first?scenario(first):null,hd=sec.querySelector('.cd-domain-hd');hd?.insertAdjacentHTML('afterend',`<div class="ctax-domain-trace"><div class="ctax-domain-fact"><label>TRACEABLE SOURCE</label><b>${esc(code)} · ${tiles.length} mapped controls</b></div><i class="ctax-domain-arrow">→</i><div class="ctax-domain-fact"><label>EVIDENCE GATE</label><b>${evidenced} evidenced · ${tiles.length-evidenced} pending</b></div><i class="ctax-domain-arrow">→</i><div class="ctax-domain-fact"><label>ASSURANCE INTERPRETATION</label><b>${gaps} assessed gaps or provisional states</b></div><i class="ctax-domain-arrow">→</i><div class="ctax-domain-fact action"><label>ACCOUNTABLE RISK PATH</label><b>${s?esc(s.id+' · '+s.name):'Domain assessment action'}</b></div></div>`)})}
  function decorate(){
    ensureState();const panel=document.getElementById('panel-controls-dashboard'),shell=panel&&panel.querySelector('.cd-shell');if(!shell)return;
    if(typeof panel.querySelectorAll!=='function')return;
    if(!shell.querySelector('.ctax-mode'))shell.querySelector('.cd-hero')?.insertAdjacentHTML('afterend',modeBar());
    if(!shell.querySelector('.ctax-summary'))shell.querySelector('.cd-kpis')?.insertAdjacentHTML('afterend',taxonomySummary());
    addFilters(panel);panel.querySelectorAll('button.cd-tile').forEach(replaceTile);addDomainTraces(panel);
    if(!shell.querySelector('.ctax-map-host'))shell.querySelector('.ctax-mode')?.insertAdjacentHTML('afterend','<div class="ctax-map-host"></div>');
    const host=shell.querySelector('.ctax-map-host');host.innerHTML=dependencyMap();
    shell.classList.toggle('ctax-dependency-mode',taxState.view==='dependencies');
    if(!shell.querySelector('.ctax-method'))shell.insertAdjacentHTML('beforeend',methodology());
    applyCombined();
  }
  function handleDeepLink(){
    if(deepApplied)return;deepApplied=true;
    const q=new URLSearchParams(location.search||'');
    if(q.get('view')!=='controls-dashboard'&&q.get('map')!=='1')return;
    ensureState();taxState.view=q.get('map')==='1'?'dependencies':'estate';
    if(DATA.controls[q.get('control')])taxState.selected=q.get('control');
    go('results');renderResults();
    const b=document.querySelector('[data-panel="panel-controls-dashboard"]');if(b)resTab(b);
    IOPAF_DASH.render();
  }
  function schedule(){setTimeout(()=>{handleDeepLink();decorate()},0)}
  const baseResTab=resTab;resTab=function(btn){baseResTab(btn);if(btn&&btn.dataset.panel==='panel-controls-dashboard')schedule()};
  const dashFilter=IOPAF_DASH.filter,dashReset=IOPAF_DASH.reset,dashTarget=IOPAF_DASH.target,dashRender=IOPAF_DASH.render;
  IOPAF_DASH.filter=function(k,v){dashFilter(k,v);schedule()};IOPAF_DASH.reset=function(){dashReset();ensureState();Object.assign(taxState,{type:'all',hierarchy:'all',effect:'all'});schedule()};IOPAF_DASH.target=function(id){dashTarget(id);schedule()};IOPAF_DASH.render=function(){dashRender();schedule()};
  const priorResults=renderResults;renderResults=function(){priorResults();schedule()};
  function setFilter(k,v){ensureState();taxState[k]=v;iamRiskState.controlTaxonomyDashboard=Object.assign({},taxState);persist();applyCombined()}
  function setView(v){ensureState();taxState.view=v;persist();decorate()}
  function select(id){if(!DATA.controls[id])return;ensureState();taxState.selected=id;taxState.view='dependencies';persist();decorate();setTimeout(()=>document.querySelector('.ctax-map-head')?.scrollIntoView({behavior:'smooth',block:'start'}),20)}
  function depth(n){ensureState();taxState.depth=n===2?2:1;persist();decorate()}
  function exportCSV(){const rows=[['Control ID','Control','Domain','Group','Priority','Control Type','Adapted Hierarchy','Risk Effect','Upstream Count','Downstream Count','Upstream IDs','Downstream IDs']];IAMCTL.forEach(c=>{const t=meta(c.id);rows.push([c.id,c.s,c.d,c.g,priority(c.id),t.type,t.hierarchy,t.effect,t.upstream.length,t.downstream.length,t.upstream.map(x=>x.id).join('; '),t.downstream.map(x=>x.id).join('; ')])});const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='IOPAF-control-taxonomy-dependencies.csv';a.click()}
  globalThis.IOPAF_DASH_TAX={decorate,filter:setFilter,view:setView,select,depth,exportCSV,data:DATA};
  schedule();
})();
</script>
