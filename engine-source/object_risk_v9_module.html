function iamRiskHead(m){return `<div class="v9-risk-head"><span class="v9-cid">${m.s.id}</span><select onchange="iamRiskState.scenario=this.value;persist();renderBayesianRisk()">${IAM_RISK_SCENARIOS.map(s=>`<option value="${s.id}">${v9esc(s.name)}</option>`).join('')}</select><select onchange="iamRiskState.objectId=this.value;persist();renderBayesianRisk()">${iamObjects.map(o=>`<option value="${o.id}" ${o.id===m.obj.id?'selected':''}>${v9esc(o.name)}</option>`).join('')}</select><span class="tag">PROVISIONAL CPT TEMPLATE · ${m.confidence.toUpperCase()} CONFIDENCE</span><span class="right">${v9esc(m.obj.criticality||'T2')} · ${v9esc(iamObjectType(m.obj.type).name)}</span></div>`;}
function iamRiskSubnav(){return `<div class="v9-risk-tabs">${[['summary','Risk summary'],['network','Bayesian network'],['evidence','Model evidence'],['register','Risk register']].map(x=>`<button class="${iamRiskState.view===x[0]?'on':''}" onclick="iamRiskState.view='${x[0]}';persist();renderBayesianRisk()">${x[1]}</button>`).join('')}<button style="margin-left:auto" onclick="iamExportRiskJSON()">Export risk model JSON</button></div>`;}
function iamRiskSummary(m){
  const riskMode=m.risk.indexOf(Math.max(...m.risk)),impactMode=m.impact.indexOf(Math.max(...m.impact)),sens=[...m.s.preventive,...m.s.detective].map(id=>{const base=iamGetResponse(m.obj.id,id),what={};what[id]=Object.assign({},base,{maturity:5,evidence:'measured',tested:Math.max(40,base.tested||0),exceptions:0,implementation:'meets'});const alt=iamBuildRiskModel(m.obj.id,what);return {id,drop:Math.max(0,m.appetite-alt.appetite)};}).sort((a,b)=>b.drop-a.drop),max=Math.max(1,...sens.map(x=>x.drop));
  return `${iamRiskHead(m)}<div class="v9-kpis"><div class="v9-kpi"><label>INHERENT EVENT LIKELIHOOD</label><b>${Math.round(m.inhProb*100)}%</b><span>template prior · scenario-specific</span></div><div class="v9-kpi teal"><label>RESIDUAL EVENT LIKELIHOOD</label><b>${Math.round(m.likeProb*100)}%</b><span>posterior across likelihood states</span></div><div class="v9-kpi"><label>CONSEQUENCE</label><b>${['Insignificant','Minor','Moderate','Major','Severe'][impactMode]}</b><span>object BIA distribution</span></div><div class="v9-kpi red"><label>RESIDUAL RISK</label><b>${IAM_RISK_LABELS[riskMode]}</b><span>distribution, not a point score</span></div><div class="v9-kpi red"><label>APPETITE EXCEEDANCE</label><b>${m.appetite}%</b><span>P(Risk ≥ High) · limit 25%</span></div></div><div class="v9-warning"><b>${m.assessed?m.assessed+' of 5 scenario controls assessed.':'Prior-only result — scenario controls are not yet assessed for this object.'}</b><span style="margin-left:4px">Production risk must not be relied on until the relevant control-object responses, BIA and CPT calibration are complete.</span></div><div class="v9-risk-grid"><div><section class="v9-panel"><div class="v9-panel-hd"><b>Likelihood and residual-risk distributions</b><small>POSTERIOR + UNCERTAINTY</small></div><div class="v9-panel-bd"><div class="v9-range"><label>Inherent likelihood</label><div class="v9-track"><i style="left:24%;width:20%;background:#6d8296"></i><em style="left:${Math.round(m.inhProb*100)}%"></em></div><b>${Math.round(m.inhProb*100)}%</b></div><div class="v9-range"><label>Residual likelihood</label><div class="v9-track"><i style="left:${Math.max(1,Math.round(m.likeProb*65))}%;width:${Math.max(6,Math.round(m.likeProb*40))}%"></i><em style="left:${Math.round(m.likeProb*100)}%;background:#0e8a7d"></em></div><b>${Math.round(m.likeProb*100)}%</b></div><div class="v9-subhd" style="margin:13px 0 4px">RESIDUAL RISK CATEGORY DISTRIBUTION</div><div class="v9-riskdist">${m.risk.map((v,i)=>`<span style="width:${v}%;background:${IAM_RISK_COL[i]}">${v>=5?v:''}</span>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(6,1fr);font-family:var(--mono);font-size:7px;color:#78889a">${IAM_RISK_LABELS.map(x=>`<span>${x}</span>`).join('')}</div><div class="v9-appetite"><b>${m.appetite>25?'Risk appetite exceeded':'Within the provisional appetite'}</b>P(Risk ≥ High) is ${m.appetite}%; the current illustrative limit is 25%.</div></div></section></div><aside style="display:grid;gap:10px"><section class="v9-panel"><div class="v9-panel-hd"><b>What drives the result</b><small>CONTROL WHAT-IF SENSITIVITY</small></div><div class="v9-panel-bd">${sens.map(x=>`<div class="v9-sens"><label>${x.id} · ${(iamCtl(x.id)||{}).s||''}</label><div><i style="width:${100*x.drop/max}%"></i></div><b>−${x.drop}pt</b></div>`).join('')}</div></section><section class="v9-panel"><div class="v9-panel-hd"><b>Evidence and model confidence</b><small>TRACEABILITY</small></div><div class="v9-panel-bd"><div class="v9-conf"><div><b>${m.tested}</b><span>TESTED CONTROLS</span></div><div><b>${m.assessed}</b><span>ASSESSED CONTROLS</span></div><div><b>${m.confidence}</b><span>MODEL CONFIDENCE</span></div></div><div class="v9-actions"><button onclick="iamRiskState.view='network';renderBayesianRisk()">Open network</button><button onclick="iamRiskState.view='evidence';renderBayesianRisk()">View CPT basis</button></div></div></section></aside></div>`;
}
function iamRiskNetwork(m){
  const e=m.effects,eff=id=>(e[id]||{dist:[20,20,20,20,20]}).dist,root=m.s.inherent,labels=IAM_EFF_LABELS,like=['Rare','Unlikely','Moderate','Likely','Almost certain'],impact=['Insignificant','Minor','Moderate','Major','Severe'];
  return `${iamRiskHead(m)}<div class="v9-warning"><b>How to read the network:</b> every row is a probability, not a maturity score. Dashed teal arrows show the shared identity-provider dependency; red arrows converge likelihood and consequence into residual risk.</div><div class="v9-bn-wrap"><div class="v9-bn-canvas"><span class="v9-bn layer" style="left:16px;border:0;box-shadow:none;background:transparent">CONTEXT</span><span class="v9-bn layer" style="left:220px;border:0;box-shadow:none;background:transparent">CONTROL EVIDENCE</span><span class="v9-bn layer" style="left:430px;border:0;box-shadow:none;background:transparent">AGGREGATED BARRIERS</span><span class="v9-bn layer" style="left:640px;border:0;box-shadow:none;background:transparent">LIKELIHOOD / IMPACT</span><span class="v9-bn layer" style="left:846px;border:0;box-shadow:none;background:transparent">RISK POSTERIOR</span><svg class="v9-bn-links" viewBox="0 0 1040 700"><defs><marker id="v9a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#778ea2"/></marker><marker id="v9r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#b42332"/></marker></defs><path d="M196 120C210 120 210 95 220 95" marker-end="url(#v9a)"/><path class="shared" d="M196 340C208 340 208 120 220 120" marker-end="url(#v9a)"/><path class="shared" d="M196 340C208 340 208 270 220 270" marker-end="url(#v9a)"/><path class="shared" d="M196 340C208 340 208 420 220 420" marker-end="url(#v9a)"/><path d="M400 105C418 105 412 180 430 180" marker-end="url(#v9a)"/><path d="M400 270C418 270 412 220 430 220" marker-end="url(#v9a)"/><path d="M400 420C418 420 412 260 430 260" marker-end="url(#v9a)"/><path d="M400 420C418 420 412 540 430 540" marker-end="url(#v9a)"/><path d="M400 580C418 580 412 580 430 580" marker-end="url(#v9a)"/><path d="M610 215C626 215 624 285 640 285" marker-end="url(#v9a)"/><path d="M196 120C520 120 530 245 640 245" marker-end="url(#v9a)"/><path d="M610 565C626 565 624 565 640 565" marker-end="url(#v9a)"/><path class="risk" d="M820 285C836 285 832 390 846 390" marker-end="url(#v9r)"/><path class="risk" d="M820 565C836 565 832 455 846 455" marker-end="url(#v9r)"/></svg>${iamRiskNode('Threat opportunity','ROOT',like,root,'root','left:16px;top:55px')}${iamRiskNode('Shared identity provider',m.commonCauseSource,labels,m.commonCauseDist,'root','left:16px;top:275px')}${iamRiskNode('D3-05 · MFA','CONTROL',labels,eff('D3-05'),'','left:220px;top:45px')}${iamRiskNode('D4-13 · Least privilege','CONTROL',labels,eff('D4-13'),'','left:220px;top:195px')}${iamRiskNode('D5-11 · JIT elevation','CONTROL',labels,eff('D5-11'),'','left:220px;top:345px')}${iamRiskNode('D5-15 + D8-05','DETECT',labels,v9roundPct(eff('D5-15').map((v,i)=>v+eff('D8-05')[i])),'','left:220px;top:505px')}${iamRiskNode('Preventive controls','DEPENDENCY-ADJUSTED',labels,v9ordinalDist(m.prevent*4,.72),'agg','left:430px;top:145px')}${iamRiskNode('Detection & response','RANKED NODE',labels,v9ordinalDist(m.detect*4,.72),'agg','left:430px;top:505px')}${iamRiskNode('Event likelihood','POSTERIOR',like,m.like,'out','left:640px;top:215px')}${iamRiskNode('Business consequence','BIA INPUT',impact,m.impact,'out','left:640px;top:495px')}${iamRiskNode('Residual risk','POSTERIOR',IAM_RISK_LABELS,m.risk,'out','left:846px;top:340px')}</div></div><div class="v9-bn-side"><section class="v9-panel"><div class="v9-panel-hd"><b>Selected control-object evidence</b><small>D3-05 · ${v9esc(m.obj.name)}</small></div><div class="v9-panel-bd">${(()=>{const p=e['D3-05'],r=p.r;return `<div class="v9-fields"><div class="v9-field"><label>Maturity</label><b>${r.maturity===null?'Unassessed':'L'+r.maturity}</b></div><div class="v9-field"><label>Evidence</label><b>${v9esc(r.evidence)}</b></div><div class="v9-field"><label>Test result</label><b>${r.tested?r.exceptions+' exceptions / '+r.tested:'Prior only'}</b></div><div class="v9-field"><label>Failure posterior</label><b>${Math.round(p.mean*100)}% · ${Math.round(p.lo*100)}–${Math.round(p.hi*100)}%</b></div></div>${iamObjDistHTML(p.dist)}`;})()}</div></section><section class="v9-panel"><div class="v9-panel-hd"><b>Network governance</b><small>NO HIDDEN PRECISION</small></div><div class="v9-panel-bd"><p style="font-size:9.5px;color:#627589;line-height:1.5;margin:0">The five-state language is universal; the numerical influence is scenario-specific. The current CPT template is provisional and must be approved, calibrated and versioned before a production risk decision.</p><div class="v9-actions"><button onclick="iamRiskState.view='evidence';renderBayesianRisk()">Open model evidence</button></div></div></section></div>`;
}
function iamRiskEvidence(m){const rows=[['Maturity → effectiveness bridge','Ordinal Gaussian template','Provisional; evidence gate applied'],['Control test updating','Beta prior + observed exceptions','Per control-object response'],['Preventive aggregation','Ranked weighted node','D3-05, D4-13, D5-11'],['Detection aggregation','Ranked weighted node','D5-15, D8-05'],['Common-cause dependency','Shared identity-provider parent','Must be calibrated'],['Consequence','Object criticality / BIA distribution','Replace template with approved BIA'],['Risk convergence','Likelihood × consequence state table','Version with model release']];return `${iamRiskHead(m)}<div class="v9-warning"><b>Model status: provisional template.</b> IOPAF separates maturity, operating evidence, control effectiveness and risk. No maturity level is treated as a guaranteed risk-reduction percentage.</div><div class="v9-panel"><div class="v9-panel-hd"><b>Conditional model register</b><small>MODEL v0.3 · APPROVAL REQUIRED</small></div><table class="v9-model-table"><thead><tr><th>MODEL COMPONENT</th><th>METHOD</th><th>EVIDENCE / GOVERNANCE</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td><code>${r[1]}</code></td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div><div class="v9-actions"><button onclick="iamExportRiskJSON()">Export model JSON</button><button class="primary" onclick="iamRiskState.view='network';renderBayesianRisk()">Return to network</button></div>`;}
function iamRiskRegister(m){const mode=m.risk.indexOf(Math.max(...m.risk));return `${iamRiskHead(m)}<div class="v9-panel"><div class="v9-panel-hd"><b>Scenario risk register</b><small>DISTRIBUTIONS + DECISIONS</small></div><table class="v9-register"><thead><tr><th>SCENARIO</th><th>ASSESSMENT OBJECT</th><th>CONTROL EVIDENCE</th><th>LIKELIHOOD</th><th>CONSEQUENCE</th><th>RISK</th><th>APPETITE</th><th>CONFIDENCE</th></tr></thead><tbody><tr><td><b>${v9esc(m.s.name)}</b></td><td>${v9esc(m.obj.name)}</td><td>${m.assessed}/5 assessed · ${m.tested}/5 tested</td><td>${Math.round(m.likeProb*100)}%</td><td>${['Insignificant','Minor','Moderate','Major','Severe'][m.impact.indexOf(Math.max(...m.impact))]}</td><td class="high">${IAM_RISK_LABELS[mode]}</td><td class="high">${m.appetite}% ≥ High</td><td>${m.confidence}</td></tr></tbody></table></div>`;}
function renderBayesianRisk(){const host=document.getElementById('v9-risk-host');if(!host)return;const m=iamBuildRiskModel(iamRiskState.objectId);host.innerHTML=iamRiskSubnav()+(iamRiskState.view==='network'?iamRiskNetwork(m):iamRiskState.view==='evidence'?iamRiskEvidence(m):iamRiskState.view==='register'?iamRiskRegister(m):iamRiskSummary(m));}
function iamEnsureRiskPanel(){const tabs=document.querySelector('.res-tabs');if(!tabs)return;let btn=document.querySelector('[data-panel="panel-risk"]');if(!btn){btn=document.createElement('button');btn.className='res-tab';btn.dataset.panel='panel-risk';btn.setAttribute('role','tab');btn.setAttribute('aria-selected','false');btn.textContent='Bayesian risk';btn.onclick=function(){resTab(btn);renderBayesianRisk();};const iamBtn=document.querySelector('[data-panel="panel-iam"]');iamBtn?iamBtn.insertAdjacentElement('afterend',btn):tabs.appendChild(btn);}let panel=document.getElementById('panel-risk');if(!panel){panel=document.createElement('div');panel.className='res-panel';panel.id='panel-risk';panel.innerHTML='<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px"><div><h3 class="section-h">Bayesian control-risk analysis</h3><p class="section-sub">A scenario-specific probability model. Maturity supplies a weak prior; control-object evidence updates effectiveness; relevant controls influence likelihood; consequence and likelihood converge into residual risk.</p></div><button class="btn-ghost no-print" onclick="iamExportObjectCSV()">Export object controls CSV</button></div><div id="v9-risk-host"></div>';const iamPanel=document.getElementById('panel-iam');iamPanel?iamPanel.insertAdjacentElement('afterend',panel):document.querySelector('.res-wrap').appendChild(panel);}const rep=document.getElementById('rep-overall');if(rep&&!document.getElementById('v9-report-pack'))rep.insertAdjacentHTML('beforeend','<div id="v9-report-pack" class="card" style="margin-top:12px;border-left:4px solid #0e8a7d"><h3>Object assurance and Bayesian risk</h3><p style="font-size:10px;color:#637488">Export the per-component control evidence and the complete scenario model, including distributions, dependencies, confidence and provisional-model disclaimer.</p><div class="v9-actions"><button onclick="iamExportObjectCSV()">Object controls CSV</button><button onclick="iamExportRiskJSON()">Scenario risk JSON</button></div></div>');renderBayesianRisk();}

function iamCSV(rows,name){const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`,csv=rows.map(r=>r.map(esc).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();}
function iamExportObjectCSV(){const rows=[['Assessment object','Object type','Environment','Criticality','Control ID','Domain','Group','Control statement','Scope mode','Implementation','Maturity','Evidence strength','Population / paths','Tested opportunities','Exceptions','Posterior failure %','95% credible low %','95% credible high %','Most likely effectiveness','Note','Action','Owner','Due','Status']];iamObjects.forEach(o=>iamControlsForObject(o).forEach(c=>{const r=iamGetResponse(o.id,c.id),p=iamEffectiveness(o.id,c.id),D=IAM_DOMAINS.find(x=>x.c===c.d);rows.push([o.name,iamObjectType(o.type).name,o.environment,o.criticality,c.id,D.name,c.g,c.s,iamControlProfile(c).mode,iamImplementationLabel(r.implementation),r.maturity===null?'':'L'+r.maturity,r.evidence,r.totalPaths||'',r.tested||'',r.exceptions||'',Math.round(p.mean*100),Math.round(p.lo*100),Math.round(p.hi*100),IAM_EFF_LABELS[p.dist.indexOf(Math.max(...p.dist))],r.note,r.action,r.owner,r.due,r.status]);}));iamCSV(rows,'IOPAF-IAM-object-assurance.csv');}
function iamExportObjectDomainCSV(dcode){const D=IAM_DOMAINS.find(x=>x.c===dcode);if(!D)return;const rows=[['Assessment object','Object type','Environment','Criticality','Control ID','Group','Control statement','Implementation','Maturity','Evidence strength','Tested opportunities','Exceptions','Posterior failure %','95% credible range','Most likely effectiveness','Note']];iamObjects.forEach(o=>iamControlsForObject(o).filter(c=>c.d===dcode).forEach(c=>{const r=iamGetResponse(o.id,c.id),p=iamEffectiveness(o.id,c.id);rows.push([o.name,iamObjectType(o.type).name,o.environment,o.criticality,c.id,c.g,c.s,iamImplementationLabel(r.implementation),r.maturity===null?'':'L'+r.maturity,r.evidence,r.tested||'',r.exceptions||'',Math.round(p.mean*100),Math.round(p.lo*100)+'–'+Math.round(p.hi*100)+'%',IAM_EFF_LABELS[p.dist.indexOf(Math.max(...p.dist))],r.note]);}));iamCSV(rows,'IOPAF-IAM-'+dcode+'-'+v9slug(D.name)+'-object-assurance.csv');}
function iamExportRiskJSON(){const m=iamBuildRiskModel(iamRiskState.objectId),payload={tool:'IOPAF',schema:9,model:'Bayesian control risk v0.3 provisional',generated:new Date().toISOString(),scenario:m.s,assessmentObject:m.obj,controlEffects:Object.fromEntries(Object.entries(m.effects).map(([id,p])=>[id,{maturity:p.r.maturity,evidence:p.r.evidence,tested:p.r.tested,exceptions:p.r.exceptions,failurePosterior:p.mean,credibleRange:[p.lo,p.hi],effectivenessDistribution:p.dist}])),likelihoodDistribution:m.like,consequenceDistribution:m.impact,riskDistribution:m.risk,appetiteExceedance:m.appetite,confidence:m.confidence,disclaimer:'Provisional CPT template; calibrate and approve before production risk decisions.'},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='IOPAF-'+m.s.id+'-'+v9slug(m.obj.name)+'-risk.json';a.click();}

function iamInstallV9(){
  iamLoadV9();
  persist=iamPersistV9;
  const baseScope=renderScope;renderScope=function(){baseScope();iamRenderObjectRegister();};
  const baseControls=renderControls;renderControls=function(){if(iamControlMode==='legacy'){baseControls();const h=document.getElementById('ctl-head');if(h)h.insertAdjacentHTML('afterbegin','<div class="v9-modebar"><button onclick="iamSetControlMode(\'object\')">Object assurance</button><button class="on">Legacy control register</button><span style="font-family:var(--mono);font-size:8px;color:#728296;margin-left:auto">MIGRATED OVERALL RESPONSES · NOT COMPONENT-SPECIFIC</span></div>');}else iamRenderObjectControls();};
  const baseResults=renderResults;renderResults=function(){baseResults();iamEnsureRiskPanel();};
  exportIamCSV=iamExportObjectCSV;
  exportIamDomainCSV=iamExportObjectDomainCSV;
  exportJSON=function(){const payload={tool:'IOPAF',version:9,date:new Date().toISOString(),meta,scope,answers,notes,files,actions,qactions,intg,streamMeta,iamR,iamEv,iamNote,iamAct,iamObjects,iamObjResponses,iamSelectedObject,iamSelectedControl,iamControlMode,iamRiskState};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const slug=(meta.org||'assessment').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'assessment';a.download=`iopaf-v9-${slug}-${meta.date||new Date().toISOString().slice(0,10)}.json`;a.click();};
  importJSON=function(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||(!d.answers&&!d.iamObjResponses)){alert('Not a valid IOPAF file.');return;}if(d.tool&&d.tool!=='IOPAF'){alert('This file was made by a different tool ('+d.tool+').');return;}answers=d.answers||{};notes=d.notes||{};files=d.files||{};actions=d.actions||{};qactions=d.qactions||{};if(d.intg){intg.ldap=Object.assign(intg.ldap,d.intg.ldap||{});intg.smtp=Object.assign(intg.smtp,d.intg.smtp||{});}if(d.streamMeta){['ops','sdlc','iam'].forEach(s=>{if(d.streamMeta[s])Object.assign(streamMeta[s],d.streamMeta[s]);});}meta=Object.assign({org:'',unit:'',assessor:'',sponsor:'',date:'',ref:'',notes:''},d.meta||{});scope=d.scope||{};iamR=d.iamR||{};iamEv=d.iamEv||{};iamNote=d.iamNote||{};iamAct=d.iamAct||{};iamObjects=Array.isArray(d.iamObjects)?d.iamObjects:[];iamObjResponses=d.iamObjResponses||{};iamSelectedObject=d.iamSelectedObject||'legacy';iamSelectedControl=d.iamSelectedControl||'D3-05';iamControlMode=d.iamControlMode||'object';iamRiskState=Object.assign(iamRiskState,d.iamRiskState||{});iamMigrateLegacy();persist();loadMetaForm();renderScope();const v=document.querySelector('.view.on').id.replace('view-','');if(v==='assess')renderAssess();if(v==='controls')renderControls();if(v==='results')renderResults();updateGauge();alert(`Assessment imported — schema v${d.version||'legacy'} migrated to v9 with ${iamObjects.length} assessment object(s).`);}catch(e){alert('Could not read file: '+e.message);}};r.readAsText(f);inp.value='';};
  resetAll=function(){if(!confirm('Clear ALL answers, object-level control evidence, risk model state, notes and scope settings? Export first if you want to keep a copy.'))return;answers={};notes={};files={};scope={};actions={};qactions={};openNotes=new Set();iamR={};iamEv={};iamNote={};iamAct={};iamObjects=[iamDefaultObject()];iamObjResponses={};iamSelectedObject='legacy';iamSelectedControl='D3-05';iamControlMode='object';iamRiskState={view:'summary',scenario:'RSK-DB-01',objectId:'legacy'};meta={org:'',unit:'',assessor:'',sponsor:'',date:'',ref:'',notes:''};try{localStorage.removeItem(LS_KEY);}catch(e){}applyDevDefaults();loadMetaForm();renderScope();renderIntg();const v=document.querySelector('.view.on').id.replace('view-','');if(v==='assess')renderAssess();if(v==='controls')renderControls();if(v==='results')renderResults();updateGauge();};
  globalThis.IOPAF_V9_API={schema:IOPAF_SCHEMA_VERSION,controlProfile:iamControlProfile,controlApplies:iamControlApplies,effectiveness:iamEffectiveness,buildRiskModel:iamBuildRiskModel,roundPct:v9roundPct,objectTypes:IAM_OBJECT_TYPES};
  persist();
  try{const q=new URLSearchParams(location.search),view=q.get('view'),risk=q.get('risk');if(view&&['framework','standards','setup','assess','controls','journey','results'].includes(view))setTimeout(()=>{go(view);if(view==='results'&&risk){iamEnsureRiskPanel();const b=document.querySelector('[data-panel="panel-risk"]');if(b)resTab(b);if(['summary','network','evidence','register'].includes(risk))iamRiskState.view=risk;renderBayesianRisk();}},0);}catch(e){}
}
iamInstallV9();
</script>
