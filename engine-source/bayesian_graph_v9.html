<style id="iopaf-v9-bn-canvas-styles">
/* Assurance Graph: clean Bayesian canvas with progressive disclosure. */
.bn-shell{max-width:100%;overflow:hidden;background:#fff;border-top:3px solid #0b2e52}
.bn-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 11px;border-bottom:1px solid #c7d4de;background:#fff}
.bn-tools b{font-size:12px;color:#0b2e52;margin-right:auto}.bn-tools b::before{content:'DECISION PATH · ';font-family:var(--mono);font-size:8px;letter-spacing:.07em;color:#0e8a7d}
.bn-tools small{font-family:var(--mono);font-size:8px;color:#6b7f8f}
.bn-tools button{min-height:32px;border:1px solid #aebfca;background:#fff;color:#173b55;padding:6px 10px;font-size:9px;font-weight:800;cursor:pointer}
.bn-tools button.on{background:#0e8a7d;border-color:#0e8a7d;color:#fff}
.bn-viewport{position:relative;width:100%;max-width:100%;min-width:0;height:650px;overflow:auto;cursor:grab;background:#fff;border-bottom:1px solid #d7e1e7}
.bn-viewport.drag{cursor:grabbing;user-select:none}.bn-stage{position:relative;max-width:none}.bn-world{position:absolute;left:0;top:0;transform-origin:0 0}.bn-edges{position:absolute;inset:0;overflow:visible}
.bn-edge{fill:none;stroke:#0e8a7d;stroke-width:3;opacity:.9}.bn-edge.context{stroke:#0b2e52}.bn-edge.shared{stroke:#4f748d;stroke-dasharray:8 6}.bn-edge.risk{stroke:#b42332;stroke-width:3.4}
.bn-edge.muted{opacity:.1}.bn-edge.trace{opacity:1;stroke-width:5}
.bn-layer{position:absolute;top:8px;font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.08em;color:#0b2e52;border-bottom:2px solid #0e8a7d;padding:4px 7px;z-index:2;pointer-events:none;white-space:nowrap}
.bn-layer.risk{border-color:#b42332}
.bn-node{position:absolute;border:1px solid #90a3b1;background:#fff;box-shadow:0 1px 4px rgba(11,46,82,.06);cursor:pointer;transition:opacity .12s,outline-color .12s}
.bn-node:hover,.bn-node.selected{outline:3px solid rgba(14,138,125,.28);z-index:3}.bn-node.muted{opacity:.2}.bn-node.trace{opacity:1}
.bn-node.group,.bn-node.barrier{border-color:#6da79a;box-shadow:0 3px 9px rgba(14,138,125,.12)}.bn-node.risk{border-color:#a83a47;box-shadow:0 3px 10px rgba(180,35,50,.14)}
.bn-node-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;padding:7px 9px;border-bottom:1px solid #bccbd5;background:#eef3f6}
.bn-node-hd b{font-size:11.5px;line-height:1.22;color:#0b2e52}.bn-node-hd>span{display:flex;align-items:center;gap:5px}.bn-node-hd code{font-family:var(--mono);font-size:8px;color:#60788a;white-space:nowrap}
.bn-expand{width:23px;height:23px;border:1px solid #6da79a;background:#fff;color:#0e8a7d;font-size:16px;font-weight:900;line-height:18px;cursor:pointer;padding:0}.bn-expand:hover{background:#e8f5ef}
.bn-node.control .bn-node-hd{background:#fbfbf5}.bn-node.group .bn-node-hd,.bn-node.barrier .bn-node-hd{background:#e8f5ef;border-bottom:2px solid #0e8a7d}.bn-node.likelihood .bn-node-hd{background:#eaf2f8}.bn-node.consequence .bn-node-hd{background:#eef3f6}.bn-node.risk .bn-node-hd{background:#f8e9ec;border-bottom:2px solid #b42332}.bn-node.shared .bn-node-hd{background:#edf1f4}
.bn-node-body{padding:6px 8px 8px}.bn-meta{font-family:var(--mono);font-size:7.8px;color:#687d8c;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bn-state{display:grid;grid-template-columns:82px 29px 1fr;align-items:center;gap:4px;min-height:16px;padding:1px 2px;font-size:8.8px;color:#435e70}.bn-state.mode{font-weight:800;color:#0b2e52;background:#edf6f4}.bn-state b{font-family:var(--mono);font-size:8.8px;text-align:right}.bn-state i{display:block;height:8px;background:#e6ebef;border-left:1px solid #b8c5ce}.bn-state i em{display:block;height:100%;min-width:1px;background:#0e8a7d}.bn-node.likelihood .bn-state i em{background:#2a6f9b}.bn-node.consequence .bn-state i em{background:#627f94}.bn-node.risk .bn-state i em{background:#b42332}
.bn-inspector{display:grid;grid-template-columns:190px 1fr 1fr;gap:0;background:#fff;min-height:112px}.bn-inspector>div{padding:12px 14px;border-right:1px solid #d7e1e7}.bn-inspector>div:last-child{border-right:0}.bn-inspector label{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.06em;color:#718493;margin-bottom:5px}.bn-inspector b{display:block;font-size:12px;color:#0b2e52;margin-bottom:4px}.bn-inspector p{font-size:9.5px;line-height:1.45;color:#516a7a;margin:0}.bn-inspector .posterior{font-family:var(--mono);color:#b42332}.bn-inspector button{margin-top:7px;border:1px solid #9fb3bf;background:#fff;color:#0b2e52;padding:5px 8px;font-size:8.5px;font-weight:800;cursor:pointer}
.bn-legend{display:flex;gap:13px;align-items:center;flex-wrap:wrap;padding:8px 11px;background:#fff;border-top:1px solid #d7e1e7;font-family:var(--mono);font-size:8px;color:#647b8b}.bn-legend i{display:inline-block;width:22px;border-top:3px solid #0e8a7d;margin-right:4px;vertical-align:middle}.bn-legend i.shared{border-color:#4f748d;border-top-style:dashed}.bn-legend i.risk{border-color:#b42332}
.bn-note{padding:9px 11px;margin-bottom:8px;border-left:3px solid #0e8a7d;background:#f7fafb;font-size:9.5px;line-height:1.45;color:#38586b}.bn-note b{color:#0b2e52}
@media(max-width:700px){#view-results{overflow-x:clip!important}#view-results .res-wrap,#panel-risk,#v9-risk-host{width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:clip!important;contain:inline-size}.bn-shell{width:100%;max-width:100%;overflow:hidden;contain:layout paint inline-size}.bn-viewport{height:620px;max-width:100%;overflow:auto}.bn-inspector{grid-template-columns:1fr}.bn-inspector>div{border-right:0;border-bottom:1px solid #d7e1e7}.bn-tools b{width:100%;margin-right:0}}
</style>
<script>
(()=>{
  const live=globalThis.IOPAF_RISK_LIVE;if(!live)return;
  const previousRender=renderBayesianRisk;
  const EFF=['Not effective','Slightly effective','Moderately effective','Very effective','Extremely effective'];
  const LIKE=['Rare','Unlikely','Moderate','Likely','Almost certain'];
  const IMP=['Insignificant','Minor','Significant','Major','Severe'];
  const RISK=['Very low','Low','Medium','High','Very high','Extreme'];
  const state={mode:'compact',zoom:.68,selected:null,expanded:new Set(),nodes:{},edges:[],layers:[],width:1740,height:900,groupCount:0};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const esc=s=>v9esc(String(s==null?'':s));
  function states(labels,dist){const mode=dist.indexOf(Math.max(...dist));return labels.map((label,i)=>`<div class="bn-state ${i===mode?'mode':''}"><span>${esc(label)}</span><b>${dist[i]}%</b><i><em style="width:${dist[i]}%"></em></i></div>`).join('');}
  function node(n){state.nodes[n.id]=n;const toggle=n.expandable?`<button class="bn-expand" aria-label="${n.expanded?'Collapse':'Expand'} ${esc(n.title)} controls" aria-expanded="${n.expanded}" onclick="event.stopPropagation();IOPAF_BN.toggle(${n.groupIndex})">${n.expanded?'−':'+'}</button>`:'';return `<div class="bn-node ${n.type||''} ${state.selected===n.id?'selected':''}" data-node="${esc(n.id)}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;min-height:${n.h}px" onclick="IOPAF_BN.select('${esc(n.id)}')"><div class="bn-node-hd"><b>${esc(n.title)}</b><span><code>${esc(n.code||'')}</code>${toggle}</span></div><div class="bn-node-body"><div class="bn-meta">${esc(n.meta||'')}</div>${states(n.labels,n.dist)}</div></div>`;}
  function anchor(n,side){if(side==='bottom')return[n.x+n.w/2,n.y+n.h];if(side==='top')return[n.x+n.w/2,n.y];if(side==='left')return[n.x,n.y+n.h/2];return[n.x+n.w,n.y+n.h/2];}
  function edge(e){const a=state.nodes[e.from],b=state.nodes[e.to];if(!a||!b)return'';let s=anchor(a,'right'),t=anchor(b,'left'),d;if(e.vertical){s=anchor(a,'bottom');t=anchor(b,'top');const my=(s[1]+t[1])/2;d=`M${s[0]},${s[1]} C${s[0]},${my} ${t[0]},${my} ${t[0]},${t[1]}`;}else if(e.route==='top'){d=`M${s[0]},${s[1]} L${s[0]+24},28 L${t[0]-24},28 L${t[0]},${t[1]}`;}else if(e.route==='bottom'){const y=state.height-24;d=`M${s[0]},${s[1]} L${s[0]+24},${y} L${t[0]-24},${y} L${t[0]},${t[1]}`;}else{const mx=(s[0]+t[0])/2;d=`M${s[0]},${s[1]} C${mx},${s[1]} ${mx},${t[1]} ${t[0]},${t[1]}`;}const kind=e.kind||'assurance';return `<path class="bn-edge ${kind}" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="${d}" marker-end="url(#bn-arrow-${kind})"/>`;}
  function controlNode(c,p,x,y){const src=iamObject(p.sourceObjectId)||iamObject(iamSelectedObject);return{id:'ctl-'+c.id,type:'control',title:c.s,code:c.id,meta:`${src?src.name:'Decision target'} · ${p.r.evidence||'none'} · L${p.r.maturity==null?'—':p.r.maturity}`,labels:EFF,dist:p.dist,x,y,w:260,h:116,data:{kind:'control',control:c,posterior:p,source:src}};}
  function layout(m){state.nodes={};const nodes=[],edges=[],groupPositions=[];state.groupCount=m.groups.length;const manuallyExpanded=state.mode==='full'||state.expanded.size>0,controlXs=[310,580,850],groupX=manuallyExpanded?1140:350,barrierX=manuallyExpanded?1510:720,eventX=manuallyExpanded?1840:1040,riskX=manuallyExpanded?2170:1370;let laneTop=52;
    m.groups.forEach((g,gi)=>{const expanded=state.mode==='full'||state.expanded.has(gi),items=g.items.slice().sort((a,b)=>{const aa=(a.p.r.tested>0?3:0)+(a.p.r.maturity!==null?2:0),bb=(b.p.r.tested>0?3:0)+(b.p.r.maturity!==null?2:0);return bb-aa||a.c.id.localeCompare(b.c.id);}),rows=expanded?Math.ceil(items.length/3):0,laneHeight=expanded?Math.max(190,rows*126+24):180,groupY=laneTop+(laneHeight-142)/2;
      if(expanded)items.forEach((item,i)=>{const n=controlNode(item.c,item.p,controlXs[i%3],laneTop+Math.floor(i/3)*126);nodes.push(n);edges.push({from:n.id,to:'grp-'+gi});});
      const gn={id:'grp-'+gi,type:'group',title:g.name,code:`${g.role.toUpperCase()} GROUP`,meta:`${g.assessed}/${g.items.length} assessed · ${g.tested} tested · ${g.effects.join(' + ')} effect · ${expanded?'controls exposed':'click + to expose '+g.items.length+' parents'}`,labels:EFF,dist:g.dist,x:groupX,y:groupY,w:280,h:142,expandable:true,expanded,groupIndex:gi,data:{kind:'group',group:g,expanded}};nodes.push(gn);groupPositions.push({g,n:gn});laneTop+=laneHeight;
    });
    state.width=manuallyExpanded?2460:1720;state.height=Math.max(850,laneTop+40);
    const avgY=(effect,fallback)=>{const a=groupPositions.filter(x=>x.g.effects.includes(effect)||x.g.effects.includes('both'));return a.length?a.reduce((s,x)=>s+x.n.y+x.n.h/2,0)/a.length-71:fallback;};let prevY=clamp(avgY('likelihood',state.height*.34),70,state.height-210),detY=clamp(avgY('consequence',state.height*.66),70,state.height-210);if(Math.abs(prevY-detY)<185){if(prevY+195<=state.height-210)detY=prevY+195;else prevY=Math.max(70,detY-195);}const eventY=clamp(prevY,70,state.height-210),impactY=clamp(detY,70,state.height-210),riskY=clamp((eventY+impactY)/2,80,state.height-195),ctxX=20;
    nodes.push({id:'ctx-threat',type:'likelihood',title:m.s.name,code:'THREAT OPPORTUNITY',meta:'Scenario-specific provisional prior',labels:LIKE,dist:m.inh,x:ctxX,y:70,w:250,h:142,data:{kind:'context',text:'Scenario opportunity prior before control evidence.'}});
    nodes.push({id:'ctx-shared',type:'shared',title:m.commonCauseSource,code:'SHARED DEPENDENCY',meta:'Common identity-provider influence',labels:EFF,dist:m.commonCauseDist,x:ctxX,y:state.height-212,w:250,h:142,data:{kind:'dependency',text:'A shared identity service can influence preventive and detective barriers simultaneously.'}});
    nodes.push({id:'bar-prev',type:'barrier',title:`${Math.round(m.prevent*100)}% effective`,code:'LIKELIHOOD CONTROLS',meta:'Taxonomy-routed + shared dependency',labels:EFF,dist:v9ordinalDist(m.prevent*4,.72),x:barrierX,y:prevY,w:270,h:142,data:{kind:'aggregate',text:'Controls classified as affecting likelihood, plus evidenced shared-service dependencies, shift the event-likelihood prior.'}});
    nodes.push({id:'bar-det',type:'barrier',title:`${Math.round(m.detect*100)}% effective`,code:'CONSEQUENCE CONTROLS',meta:'Taxonomy-routed aggregate',labels:EFF,dist:v9ordinalDist(m.detect*4,.72),x:barrierX,y:detY,w:270,h:142,data:{kind:'aggregate',text:'Controls classified as affecting consequence shift the object-specific consequence prior.'}});
    nodes.push({id:'event-like',type:'likelihood',title:`${Math.round(m.likeProb*100)}% likely or above`,code:'EVENT LIKELIHOOD',meta:`Posterior · ${m.confidence} confidence`,labels:LIKE,dist:m.like,x:eventX,y:eventY,w:270,h:142,data:{kind:'likelihood',text:'Threat opportunity, preventive controls and detection/response converge here.'}});
    nodes.push({id:'event-impact',type:'consequence',title:IMP[m.impact.indexOf(Math.max(...m.impact))],code:'CONSEQUENCE',meta:`${m.obj.criticality||'T2'} decision target`,labels:IMP,dist:m.impact,x:eventX,y:impactY,w:270,h:142,data:{kind:'consequence',text:'Business impact and detection/response influence the consequence distribution.'}});
    nodes.push({id:'risk-post',type:'risk',title:RISK[m.risk.indexOf(Math.max(...m.risk))],code:'RESIDUAL RISK POSTERIOR',meta:`P(Risk ≥ High) ${m.appetite}% · ${m.appetiteLimit===null?'limit not configured':'limit '+m.appetiteLimit+'%'}`,labels:RISK,dist:m.risk,x:riskX,y:riskY,w:280,h:162,data:{kind:'risk',text:'Event likelihood and consequence converge into residual risk; an appetite decision requires an approved limit.'}});
    groupPositions.forEach(({g,n})=>{if(g.effects.includes('likelihood')||g.effects.includes('both'))edges.push({from:n.id,to:'bar-prev'});if(g.effects.includes('consequence')||g.effects.includes('both'))edges.push({from:n.id,to:'bar-det'});});
    edges.push({from:'ctx-threat',to:'event-like',kind:'context',route:'top'},{from:'ctx-shared',to:'bar-prev',kind:'shared',route:'bottom'},{from:'bar-prev',to:'event-like'},{from:'bar-det',to:'event-impact'},{from:'event-like',to:'risk-post',kind:'risk'},{from:'event-impact',to:'risk-post',kind:'risk'});
    nodes.forEach(n=>{state.nodes[n.id]=n;});state.edges=edges;
    state.layers=manuallyExpanded?[['01 · CONTROL EVIDENCE',310],['02 · GROUP POSTERIORS',1140],['03 · CONTROL BARRIERS',1510],['04 · LIKELIHOOD + CONSEQUENCE',1840],['05 · RESIDUAL RISK',2170,'risk']]:[['01 · CONTEXT',20],['02 · GROUP POSTERIORS',350],['03 · CONTROL BARRIERS',720],['04 · LIKELIHOOD + CONSEQUENCE',1040],['05 · RESIDUAL RISK',1370,'risk']];
    return{nodes,edges};
  }
  function inspector(n){if(!n)return`<div><label>SELECT A NODE</label><b>Trace the Bayesian model</b><p>Select a node to highlight its direct parents and children. Use + on a group to expose its individual control parents.</p></div><div><label>DEFAULT VIEW</label><b>High-level causal model</b><p>Group posteriors, likelihood controls, consequence controls and residual risk remain visible without the control wall.</p></div><div><label>DECISION USE</label><b>Audited mathematics · provisional calibration</b><p>Exact control posteriors are implemented; scenario priors and conditional influence values still require organizational calibration.</p></div>`;const d=n.data||{};if(d.kind==='control'){const p=d.posterior,r=p.r,c=d.control;return`<div><label>CONTROL NODE</label><b>${esc(c.id)} · ${esc(c.s)}</b><p>${esc((d.source||{}).name||'Decision target')}</p></div><div><label>ASSESSMENT EVIDENCE</label><b>L${r.maturity==null?'—':r.maturity} · ${esc(r.evidence||'none')}</b><p>${r.tested||0} tested · ${r.exceptions||0} exceptions · ${Math.round(p.mean*100)}% posterior failure</p></div><div><label>TRACEABILITY</label><b class="posterior">Exact 95% range ${Math.round(p.lo*100)}–${Math.round(p.hi*100)}%</b><p>${esc(c.ref||'Mapped source frameworks')} · feeds ${esc(c.g)}</p><button onclick="IOPAF_BN.clear()">Clear trace</button></div>`;}if(d.kind==='group'){const g=d.group;return`<div><label>CONTROL-GROUP NODE</label><b>${esc(g.name)}</b><p>${g.items.length} applicable control parents</p></div><div><label>EVIDENCE STATE</label><b>${g.assessed} assessed · ${g.tested} tested</b><p>${esc(g.roles.join(' + '))} type · ${esc(g.effects.join(' + '))} risk effect</p><button onclick="IOPAF_BN.toggle(${n.groupIndex})">${d.expanded?'Collapse':'Expand'} controls</button></div><div><label>MODEL BASIS</label><b>Taxonomy-routed aggregation</b><p>Applicable parent controls are weighted before their likelihood or consequence influence is applied.</p><button onclick="IOPAF_BN.clear()">Clear trace</button></div>`;}return`<div><label>${esc(n.code)}</label><b>${esc(n.title)}</b><p>${esc(n.meta)}</p></div><div><label>MODEL RELATIONSHIP</label><b>${esc(d.kind||'Bayesian node')}</b><p>${esc(d.text||'Select upstream nodes to trace this posterior.')}</p></div><div><label>TRACE HIGHLIGHT</label><b>Parents + children</b><p>Strong lines show direct causal relationships; unrelated paths are subdued.</p><button onclick="IOPAF_BN.clear()">Clear trace</button></div>`;}
  function applyTrace(){const id=state.selected,related=new Set(id?[id]:[]);document.querySelectorAll('.bn-edge').forEach(el=>{const direct=id&&(el.dataset.from===id||el.dataset.to===id);el.classList.toggle('trace',!!direct);el.classList.toggle('muted',!!id&&!direct);if(direct){related.add(el.dataset.from);related.add(el.dataset.to);}});document.querySelectorAll('.bn-node').forEach(el=>{const on=related.has(el.dataset.node);el.classList.toggle('trace',!!id&&on);el.classList.toggle('muted',!!id&&!on);el.classList.toggle('selected',el.dataset.node===id);});}
  function applyZoom(z){state.zoom=clamp(z,.32,1.25);const world=document.getElementById('bn-world'),stage=document.getElementById('bn-stage'),label=document.getElementById('bn-zoom-label'),vp=document.getElementById('bn-viewport');if(!world||!stage)return;world.style.transform=`scale(${state.zoom})`;stage.style.width=(state.width*state.zoom)+'px';stage.style.height=(state.height*state.zoom)+'px';if(vp)vp.style.height=Math.round(clamp(state.height*state.zoom+20,470,700))+'px';if(label)label.textContent=Math.round(state.zoom*100)+'%';}
  function attach(){const vp=document.getElementById('bn-viewport');if(!vp)return;applyZoom(state.zoom);let drag=false,x=0,y=0,sl=0,st=0;vp.onpointerdown=e=>{if(e.target.closest('.bn-node,.bn-tools'))return;drag=true;x=e.clientX;y=e.clientY;sl=vp.scrollLeft;st=vp.scrollTop;vp.classList.add('drag');vp.setPointerCapture(e.pointerId);};vp.onpointermove=e=>{if(!drag)return;vp.scrollLeft=sl-(e.clientX-x);vp.scrollTop=st-(e.clientY-y);};vp.onpointerup=()=>{drag=false;vp.classList.remove('drag');};const selected=state.selected&&state.nodes[state.selected];document.getElementById('bn-inspector').innerHTML=inspector(selected);applyTrace();}
  function renderGraph(m){const g=layout(m),all=g.nodes.map(node).join(''),paths=g.edges.map(edge).join(''),layers=state.layers.map(x=>`<div class="bn-layer ${x[2]||''}" style="left:${x[1]}px">${x[0]}</div>`).join('');setTimeout(attach,0);const opts=live.scenarios.filter(s=>s.domain==='D1'||IAMCTL.some(c=>c.d===s.domain&&iamControlApplies(c,m.obj))),expanded=state.mode==='full'||state.expanded.size>0;return`${iamRiskSubnav()}<div class="v9-risk-head"><span class="v9-cid">${m.s.id}</span><select onchange="iamRiskState.scenario=this.value;iamRiskState.lastCalculated=new Date().toISOString();persist();renderBayesianRisk()">${opts.map(s=>`<option value="${s.id}" ${s.id===m.s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select onchange="iamRiskState.objectId=this.value;iamRiskState.lastCalculated=new Date().toISOString();persist();renderBayesianRisk()">${iamObjects.map(o=>`<option value="${o.id}" ${o.id===m.obj.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select><span class="tag">MODEL v0.5 · AUDITED · ${m.confidence.toUpperCase()} CONFIDENCE</span><span class="right">${esc(m.obj.criticality||'T2')} · ${esc(iamObjectType(m.obj.type).name)}</span></div><div class="risk-live-state ${m.whatIf?'whatif':m.assessed?'':'prior'}"><b>${m.whatIf?'WHAT-IF · IAM STREAM DISABLED':m.assessed?'LIVE ASSESSMENT EVIDENCE':'PRIOR ONLY'}.</b> ${m.assessed}/${m.controlsCount} applicable controls assessed for ${esc(m.obj.name)}. <code>LAST CALCULATED · ${esc(iamRiskState.lastCalculated?new Date(iamRiskState.lastCalculated).toLocaleString():'Not yet updated')}</code></div><div class="bn-note"><b>Audited Bayesian model.</b> Exact Beta control posteriors feed a taxonomy-routed causal model. Unassessed controls provide no risk reduction; N/A controls are excluded. Scenario priors and influence coefficients remain provisional pending organizational calibration.</div><div class="bn-shell"><div class="bn-tools"><b>${esc(m.s.name)}</b><button class="${!expanded?'on':''}" onclick="IOPAF_BN.mode('compact')">Collapse all</button><button class="${state.mode==='full'?'on':''}" onclick="IOPAF_BN.mode('full')">Expand all controls</button><button onclick="IOPAF_BN.zoom(-.1)">−</button><small id="bn-zoom-label">${Math.round(state.zoom*100)}%</small><button onclick="IOPAF_BN.zoom(.1)">+</button><button onclick="IOPAF_BN.fit()">Fit</button><button onclick="IOPAF_BN.reset()">Reset</button></div><div class="bn-viewport" id="bn-viewport"><div class="bn-stage" id="bn-stage"><div class="bn-world" id="bn-world" style="width:${state.width}px;height:${state.height}px"><svg class="bn-edges" width="${state.width}" height="${state.height}" viewBox="0 0 ${state.width} ${state.height}"><defs><marker id="bn-arrow-assurance" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e8a7d"/></marker><marker id="bn-arrow-context" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b2e52"/></marker><marker id="bn-arrow-shared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4f748d"/></marker><marker id="bn-arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b42332"/></marker></defs>${paths}</svg>${layers}${all}</div></div></div><div class="bn-inspector" id="bn-inspector">${inspector(null)}</div><div class="bn-legend"><span><i></i> audited conditional influence</span><span><i class="shared"></i> evidenced shared dependency</span><span><i class="risk"></i> likelihood/consequence to residual risk</span><span>Click + to expand a group · select a node to trace · drag to pan</span></div></div>`;}
  renderBayesianRisk=function(){if(iamRiskState.view!=='network')return previousRender();const host=document.getElementById('v9-risk-host');if(!host)return;if(!iamObject(iamRiskState.objectId))iamRiskState.objectId=iamSelectedObject||'legacy';const m=live.build(iamRiskState.objectId,null,iamRiskState.scenario);host.innerHTML=renderGraph(m);};
  live.open=function(id,view){iamRiskState.scenario=id;iamRiskState.objectId=iamSelectedObject;iamRiskState.view=view||'network';iamRiskState.lastCalculated=new Date().toISOString();persist();go('results');setTimeout(()=>{iamEnsureRiskPanel();const b=document.querySelector('[data-panel="panel-risk"]');if(b)resTab(b);renderBayesianRisk();},0);};
  globalThis.IOPAF_BN={
    mode:v=>{state.mode=v;state.expanded.clear();state.selected=null;state.zoom=v==='full'?.46:.68;renderBayesianRisk();},
    toggle:i=>{if(state.mode==='full'){state.mode='compact';state.expanded=new Set(Array.from({length:state.groupCount},(_,x)=>x));}state.expanded.has(i)?state.expanded.delete(i):state.expanded.add(i);state.selected=null;state.zoom=state.expanded.size?.5:.68;renderBayesianRisk();},
    zoom:d=>applyZoom(state.zoom+d),
    fit:()=>{const vp=document.getElementById('bn-viewport');if(!vp)return;applyZoom(clamp((vp.clientWidth-20)/state.width,.32,1));vp.scrollLeft=0;vp.scrollTop=0;},
    reset:()=>{applyZoom(state.mode==='full'||state.expanded.size?.5:.68);const vp=document.getElementById('bn-viewport');if(vp){vp.scrollLeft=0;vp.scrollTop=0;}},
    select:id=>{state.selected=id;const el=document.getElementById('bn-inspector');if(el)el.innerHTML=inspector(state.nodes[id]);applyTrace();},
    clear:()=>{state.selected=null;const el=document.getElementById('bn-inspector');if(el)el.innerHTML=inspector(null);applyTrace();},
    state
  };
})();
</script>
