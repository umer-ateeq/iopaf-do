ates."}],"downstream":[]},"D1-13":{"type":"Detective","typeReason":"An independent review is designed to detect control failures or blind spots after they occur, making it a detective control.","hierarchy":"Administrative","hierarchyReason":"The control relies on manual oversight, audits, and reviews by an independent party, which is an administrative process.","effect":"Likelihood","effectReason":"The control detects existing failures or blind spots by independently reviewing IAM controls, reducing the likelihood of undiscovered issues persisting.","upstream":[{"id":"D1-01","relation":"enables","rationale":"The approved IAM policy provides the standard against which the independent review is conducted."}],"downstream":[]},"D1-14":{"type":"Detective","typeReason":"The control monitors defined indicators to identify potential insider threats, which is a detective function.","hierarchy":"Administrative","hierarchyReason":"Monitoring indicators and initiating investigations is a process-driven, manual oversight activity rather than automated technical enforcement.","effect":"Likelihood","effectReason":"Detecting insider threats early reduces the likelihood of a successful attack or prolonged misuse.","upstream":[{"id":"D8-01","relation":"enables","rationale":"Logging authentication and authorisation events provides the identity data on which insider-threat indicators are monitored."},{"id":"D8-05","relation":"shared_dependency","rationale":"Operational monitoring of identity events against rules overlaps directly with monitoring insider-threat indicators."},{"id":"D8-06","relation":"enables","rationale":"Defining a lawful basis for personnel monitoring provides the necessary foundation for monitoring insider-threat indicators."}],"downstream":[]},"D2-01":{"type":"Preventive","typeReason":"This control is preventive because it stops unverified identity creation by enforcing HR as the sole authoritative source.","hierarchy":"Engineering","hierarchyReason":"This control a ":"The reconciliation detects failures where role change re-evaluations did not successfully update target system entitlements."}]},"D2-08":{"type":"Preventive","typeReason":"The control acts preventively by actively removing access upon transfer, preventing unauthorized actions before they can occur.","hierarchy":"Administrative","hierarchyReason":"Entitlement removal is a manual or automated administrative process that manages permissions rather than physically engineering the system or eliminating the access mechanism entirely.","effect":"Likelihood","effectReason":"Removing prior-role entitlements prevents a user from exercising accumulated access they no longer need, reducing the likelihood of abuse or SoD conflicts.","upstream":[{"id":"D2-07","relation":"enables","rationale":"Role change triggering re-evaluation enables the removal of prior-role entitlements."},{"id":"D7-06","relation":"enables","rationale":"Automated provisioning from the authoritative source enables consistent and timely removal of entitlements upon transfer."},{"id":"D2-11","relation":"detects_failure","rationale":"Monthly reconciliation of mover events detects if the required entitlement removal failed in target systems."}],"downstream":[{"id":"D2-11","relation":"detects_failure","rationale":"The reconciliation detects failures where prior role entitlements were not successfully removed during the transfer."}]},"D2-09":{"type":"Directive","typeReason":"The control directs action by notifying system owners to perform their part of the transfer process.","hierarchy":"Administrative","hierarchyReason":"Notifications rely on human owners to act upon the information, making it an administrative control.","effect":"Likelihood","effectReason":"Notifications reduce the likelihood of inappropriate access remaining active by triggering the review process.","upstream":[{"id":"D1-06","relation":"requires","rationale":"Notification delivery requires named system owners to be identified for the target systems."}],"downstream":[]},"D2-10":{"type":"Preventive","typeReason":"The control is preventive because it aims to prevent the creation of permanent excess privileges by enforcing time-bound temporary dual access.","hierarchy":"Administrative","hierarchyReason":"The control relies on policy, process, and manual oversight to justify, approve, and enforce the end date of temporary dual access.","effect":"Likelihood","effectReason":"The control prevents unauthorized access by ensuring temporary dual access is time-bound and ends on schedule, reducing the likelihood of a permanent excess privilege.","upstream":[{"id":"D1-01","relation":"enables","rationale":"The IAM policy provides the mandate and rules for managing temporary dual access during handovers."}],"downstream":[]},"D2-11":{"type":"Detective","typeReason":"The control detects discrepancies between processed mover events and actual target-system entitlements after the fact.","hierarchy":"Administrative","hierarchyReason":"The monthly reconciliation relies on procedural oversight and manual investigation to ensure mover events are correctly applied.","effect":"Likelihood","effectReason":"Detecting and investigating failed mover events reduces the likelihood of inappropriate access being exploited.","upstream":[{"id":"D2-07","relation":"detects_failure","rationale":"The reconciliation detects failures where role change re-evaluations did not successfully update target system entitlements."},{"id":"D2-08","relation":"detects_failure","rationale":"The reconciliation detects failures where prior role entitlements were not successfully removed during the transfer."}],"downstream":[{"id":"D2-08","relation":"detects_failure","rationale":"Monthly reconciliation of mover events detects if the required entitlement removal failed in target systems."}]},"D2-12":{"type":"Preventive","typeReason":"It automatically disables accounts to prevent unauthorized access by terminated individuals.","hierarchy":"Engineering","hierarch e it relies on policy, contract terms, and manual exit processes rather than technical enforcement.","effect":"Likelihood","effectReason":"Prevents data exposure by ensuring leavers are legally bound to confidentiality post-employment.","upstream":[{"id":"D1-01","relation":"enables","rationale":"The IAM policy provides the governance mandate for leaver processes."}],"downstream":[]},"D2-16":{"type":"Preventive","typeReason":"Disabling the account immediately prevents unauthorized access from occurring in the first place.","hierarchy":"Administrative","hierarchyReason":"This relies on defined procedures and manual triggering by HR or management rather than an automated technical safeguard.","effect":"Likelihood","effectReason":"Disabling accounts immediately prevents access and reduces the likelihood of unauthorized actions by high-risk leavers.","upstream":[{"id":"D1-01","relation":"enables","rationale":"The approved IAM policy mandates and provides the authority for immediate disablement procedures."},{"id":"D2-01","relation":"supplies_evidence","rationale":"HR acts as the authoritative source identifying the high-risk leaver status."}],"downstream":[]},"D2-17":{"type":"Preventive","typeReason":"The control technically disables access, preventing an attacker from misusing a dormant account.","hierarchy":"Engineering","hierarchyReason":"The control is an automated, technically enforced safeguard that disables access without manual intervention.","effect":"Likelihood","effectReason":"Disabling the account removes the attack vector, directly reducing the likelihood of a successful compromise.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The authentication standard defines the inactivity threshold that this control enforces."},{"id":"D8-01","relation":"supplies_evidence","rationale":"Authentication logs supply the last-logon data required to calculate account inactivity."}],"downstream":[]},"D2-18":{"type":"Detective","typeReason":"Reconciling the inven {"id":"D2-18","relation":"enables","rationale":"The service account inventory enables the assignment and tracking of owners for each account."}],"downstream":[{"id":"D2-24","relation":"enables","rationale":"A named accountable owner is necessary to action the certificate renewal process before expiry."}]},"D2-20":{"type":"Preventive","typeReason":"Rotating credentials prevents unauthorized access by invalidating older, potentially exposed credentials before they can be used.","hierarchy":"Administrative","hierarchyReason":"Scheduling and enforcing rotation relies on process, ownership, and manual or scheduled oversight rather than eliminating the credential.","effect":"Likelihood","effectReason":"Rotating credentials reduces the likelihood that an exposed credential can be successfully exploited.","upstream":[{"id":"D1-03","relation":"requires","rationale":"The authentication standard mandates the credential rules, including the rotation schedule that must be enforced."},{"id":"D2-18","relation":"enables","rationale":"The service account inventory enables rotation by providing the population of accounts that must be rotated."}],"downstream":[]},"D2-21":{"type":"Preventive","typeReason":"The control requires technical prevention of interactive login for system accounts, stopping unauthorized access before it occurs.","hierarchy":"Engineering","hierarchyReason":"The control is technically enforced through system configuration to prevent logon, making it an engineering control.","effect":"Likelihood","effectReason":"Preventing interactive logon for system accounts reduces the likelihood of unauthorized administrative access by humans.","upstream":[{"id":"D1-02","relation":"enables","rationale":"The access control policy establishes the mandate that system accounts must be restricted from interactive use."},{"id":"D8-01","relation":"detects_failure","rationale":"Logging authentication events detects when the technical prevention fails and an interactive logon occurs."}],"downstream":[]},"D2-22":{"type":"Preventive","typeReason":"Refusing or restricting unknown devices proactively stops unauthorised access before it can occur.","hierarchy":"Engineering","hierarchyReason":"Device identification and conditional access restrictions are automated technical safeguards enforced by the system.","effect":"Likelihood","effectReason":"Enforcing device authentication blocks access from unmanaged endpoints, reducing the likelihood of successful credential abuse.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The authentication standard defines the mandatory rules and limits that this technical control enforces."}],"downstream":[]},"D2-23":{"type":"Preventive","typeReason":"By enforcing registration, internal sponsorship, and defined expiry dates, the control proactively prevents unauthorized persistence of third-party identities before access can be misused.","hierarchy":"Administrative","hierarchyReason":"This relies on human oversight, processes, and internal sponsors rather than purely technical engineering enforcement, making it an administrative control.","effect":"Likelihood","effectReason":"Registering, scoping, and enforcing expiry on third-party identities prevents the likelihood of unauthorized access from lingering or overly broad partner accounts.","upstream":[{"id":"D1-01","relation":"enables","rationale":"The IAM policy mandates the requirements for registering and managing third-party identities, enabling this control."}],"downstream":[{"id":"D5-19","relation":"enables","rationale":"Registration and scoping of third-party identities enables them to be brokered and monitored."},{"id":"D8-07","relation":"enables","rationale":"Registering and scoping third-party identities provides the inventory of external access that must be monitored."}]},"D2-24":{"type":"Preventive","typeReason":"Tracking expiry and renewing certificates proactively prevents outages before they occur.","hierarchy":"Administrative","hierarchyReason":"Tracking and renewing certificates relies on monitored operational processes and inventory management.","effect":"Likelihood","effectReason":"Tracking and renewing certificates prevents service outages and maintains secure authentication.","upstream":[{"id":"D2-18","relation":"enables","rationale":"A service account inventory provides the baseline to track which non-human identities require certificate renewal."},{"id":"D2-19","relation":"enables","rationale":"A named accountable owner is necessary to action the certificate renewal process before expiry."}],"downstream":[]},"D3-01":{"type":"Preventive","typeReason":"The control prevents unauthorized local access by technically forcing all authentication attempts through the central enterprise SSO service.","hierarchy":"Substitution","hierarchyReason":"Enterprise SSO replaces separate local application authentication with a safer centrally controlled mechanism.","effect":"Likelihood","effectReason":"By centralizing authentication, it prevents credential theft across multiple disconnected application stores and reduces the likelihood of unauthorized access.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The authentication standard defines the requirement and scope for enterprise SSO integration, providing the mandate for this control."}],"downstream":[]},"D3-02":{"type":"Preventive","typeReason":"It stops unauthorized access by requiring signatures and validation before granting entry.","hierarchy":"Engineering","hierarchyReason":"It relies on automated technical enforcement of signatures and validation to secure assertions.","effect":"Likelihood","effectReason":"It prevents forged assertions from being used, reducing the likelihood of unauthorized access.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The authentication standard mandates the requirement for strong federation controls."}],"downstream":[]},"D3-03":{"type":"Preventive","typeReason":"It governs credential acceptance proactively before access is granted.","hierarchy":"Administrative","hierarchyReason":"This control relies on documented policy decisions and assurance assessments, not technical enforcement.","effect":"Likelihood","effectReason":"Governing acceptance of external credentials reduces the likelihood of untrusted access.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The authentication standard establishes the required assurance levels that must be met by external credentials."}],"downstream":[]},"D3-04":{"type":"Preventive","typeReason":"Demanding re-authentication prevents a hijacked session from escalating privileges without meeting a new challenge.","hierarchy":"Engineering","hierarchyReason":"The system automatically enforces the re-authentication challenge when a privilege change is attempted.","effect":"Likelihood","effectReason":"It reduces the likelihood of a successful session hijacking leading to privilege escalation.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The published authentication standard establishes the mandate and rules for when re-authentication is required."}],"downstream":[]},"D3-05":{"type":"Preventive","typeReason":"The control prevents unauthorized access by enforcing a multi-factor authentication challenge before access is granted.","hierarchy":"Engineering","hierarchyReason":"MFA enforcement is a technical safeguard built into the authentication system, which aligns with Engineering controls.","effect":"Likelihood","effectReason":"Enforcing MFA reduces the likelihood of successful administrative account compromise via credential theft.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The authentication standard mandates MFA for administrative tiers, providing the policy basis for enforcement."},{"id":"D3-09","relation":"shared_dependency","rationale":"Administrative MFA enforcement relies on the MFA platform being configured to resist enrollment, reset and bypass misuse."}],"downstream":[{"id":"D5-07","relation":"enables","rationale":"The enterprise administrative MFA capability enables the vault to enforce multi-factor authentication for privileged users."}]},"D3-06":{"type":"Preventive","typeReason":"Enforcing MFA prevents unauthorized remote network access before it can occur.","hierarchy":"Engineering","hierarchyReason":"MFA is a technically enforced, automated safeguard that blocks unauthorized access at the system level.","effect":"Likelihood","effectReason":"MFA enforcement reduces the likelihood of unauthorized remote access by requiring multiple factors.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The published authentication standard provides the mandate and rules for enforcing MFA on remote access."}],"downstream":[]},"D3-07":{"type":"Preventive","typeReason":"Enforcing MFA stops unauthorized access before it occurs by requiring multiple authentication factors.","hierarchy":"Engineering","hierarchyReason":"MFA is an automated technical safeguard that enforces strong authentication.","effect":"Likelihood","effectReason":"MFA prevents credential stuffing attacks from succeeding, reducing the likelihood of unauthorized access.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The authentication standard mandates MFA rules, enabling its enforcement."},{"id":"D7-03","relation":"requires","rationale":"Enforcing MFA requires an inventory of applications to know what is exposed."}],"downstream":[]},"D3-08":{"type":"Preventive","typeReason":"MFA actively prevents unauthorized users from authenticating into the CDE by requiring multiple factors upfront.","hierarchy":"Engineering","hierarchyReason":"MFA is a technical safeguard implemented in the system configuration to enforce authentication rules automatically.","effect":"Likelihood","effectReason":"MFA prevents unauthorized access, which directly reduces the likelihood of a successful breach or compromise.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The authentication standard mandates the MFA requirement and defines acceptable factors for CDE access."},{"id":"D1-06","relation":"requires","rationale":"Identifying system owners for in-scope assets is required to define the CDE scope that needs MFA."},{"id":"D3-09","relation":"requires","rationale":"The MFA systems must be configured securely to prevent misuse for the CDE MFA to be effective."}],"downstream":[]},"D3-09":{"type":"Preventive","typeReason":"The control acts to prevent misuse such as bypass or fatigue attacks before they can result in unauthorized access.","hierarchy":"Engineering","hierarchyReason":"Configuring MFA systems to prevent misuse involves technically enforced, automated safeguards, aligning directly with the Engineering tier.","effect":"Likelihood","effectReason":"Properly configured MFA systems prevent unauthorized access by blocking bypass, replay, and fatigue attacks, thereby reducing the likelihood of a successful breach.","upstream":[{"id":"D1-03","relation":"requires","rationale":"The authentication standard mandates the required MFA rules and session limits that this control configures."}],"downstream":[{"id":"D3-08","relation":"requires","rationale":"The MFA systems must be configured securely to prevent misuse for the CDE MFA to be effective."},{"id":"D3-10","relation":"enables","rationale":"Proper configuration of MFA systems to prevent misuse enables the implementation of replay-resistant authentication mechanisms."},{"id":"D3-05","relation":"shared_dependency","rationale":"Administrative MFA enforcement relies on the MFA platform being configured to resist enrollment, reset and bypass misuse."}]},"D3-10":{"type":"Preventive","typeReason":"It is a Preventive control because it aims to block an attacker from successfully authenticating using captured credentials.","hierarchy":"Engineering","hierarchyReason":"It is an Engineering control because it relies on technically enforced/automated safeguards (replay-resistant mechanisms) rather than manual oversight.","effect":"Likelihood","effectReason":"The control prevents unauthorized access by requiring replay-resistant mechanisms, directly reducing the likelihood of a successful attack.","upstream":[{"id":"D3-09","relation":"enables","rationale":"Proper configuration of MFA systems to prevent misuse enables the implementation of replay-resistant authentication mechanisms."}],"downstream":[]},"D3-11":{"type":"Preventive","typeReason":"This control prevents the creation of weak passwords that could be easily compromised.","hierarchy":"Engineering","hierarchyReason":"Password length and composition rules are technically enforced by the system, fitting the Engineering category.","effect":"Likelihood","effectReason":"Enforcing strong passwords reduces the likelihood of successful credential guessing or brute-force attacks.","upstream":[{"id":"D1-03","relation":"requires","rationale":"The standard defines the length and composition rules that this control enforces."}],"downstream":[]},"D3-12":{"type":"Preventive","typeReason":"The control prevents a breach in one system from leading to a breach in another by enforcing unique passwords.","hierarchy":"Engineering","hierarchyReason":"The control is technically enforced through configuration to prevent password reuse, which is an engineering safeguard.","effect":"Likelihood","effectReason":"The control directly prevents initial compromise by reducing the likelihood of a successful credential stuffing attack.","upstream":[{"id":"D1-02","relation":"enables","rationale":"The access control policy defines the standards for passwords that this control enforces."}],"downstream":[]},"D3-13":{"type":"Preventive","typeReason":"Removing default credentials before deployment is a proactive measure that prevents unauthorized access via known defaults.","hierarchy":"Elimination","hierarchyReason":"Removing default authenticators is literal elimination of a known vulnerability path before deployment.","effect":"Likelihood","effectRea hat the platform then technically enforces."},{"id":"D7-14","relation":"requires","rationale":"Detecting out-of-process grants requires a defined access granting process to exist as a baseline."}]},"D4-03":{"type":"Preventive","typeReason":"Establishing a process to revoke access prevents unauthorized users from maintaining active access.","hierarchy":"Administrative","hierarchyReason":"A defined process with triggers and service levels relies on manual or automated oversight and procedures.","effect":"Likelihood","effectReason":"Revoking access prevents future unauthorized access, directly reducing the likelihood of a cyber incident.","upstream":[{"id":"D1-01","relation":"enables","rationale":"The approved IAM policy mandates the establishment of the access revoking process."}],"downstream":[]},"D4-04":{"type":"Preventive","typeReason":"Managing access through a central system prevents unauthorized or uncoordinated access grants from occurring in the first place.","hierarchy":"Engineering","hierarchyReason":"An access control system is an automated, technical safeguard that enforces access policies, fitting the definition of Engineering.","effect":"Likelihood","effectReason":"The control prevents the likelihood of ungoverned access by ensuring all access is managed centrally rather than manually.","upstream":[{"id":"D7-01","relation":"enables","rationale":"The application register mapping systems to IDM connectors enables the central access control system to manage access."},{"id":"D7-02","relation":"enables","rationale":"Integration of systems with the IDM platform enables the central access control system to actually administer the access."}],"downstream":[]},"D4-05":{"type":"Preventive","typeReason":"By restricting access to only what is needed, the control proactively prevents unauthorized access to unnecessary data.","hierarchy":"Administrative","hierarchyReason":"Determining business need and justifying broad access relies on policy and manual oversight, making it an administrative control.","effect":"Consequence","effectReason":"Restricting access to business need limits the blast radius of a compromised account, reducing the consequence of an incident.","upstream":[{"id":"D1-02","relation":"enables","rationale":"The access control policy defined per system tier provides the rules required to determine what access is appropriate for a business need."},{"id":"D4-01","relation":"enables","rationale":"An entitlement catalogue is required to identify and assign the specific entitlements needed for a business function."},{"id":"D1-06","relation":"enables","rationale":"System and data owners must be identified to determine and approve the business need for access to their assets."}],"downstream":[]},"D4-06":{"type":"Preventive","typeReason":"Removing access before it can be exploited prevents unauthorized use.","hierarchy":"Administrative","hierarchyReason":"Revocation requires manual or policy-driven processes to identify and remove unused access.","effect":"Likelihood","effectReason":"Revoking access prevents future unauthorized actions, reducing the likelihood of a security incident.","upstream":[{"id":"D6-03","relation":"detects_failure","rationale":"Access reviews detect unused access that should be revoked."}],"downstream":[]},"D4-07":{"type":"Preventive","typeReason":"By defining roles as the primary means of assignment, it prevents ad-hoc, individual entitlement assignments.","hierarchy":"Administrative","hierarchyReason":"Defining and maintaining a role model is a process of policy and documentation, which is an administrative control.","effect":"Likelihood","effectReason":"A defined role model reduces the likelihood of excessive or incorrect individual access assignments.","upstream":[{"id":"D4-01","relation":"enables","rationale":"A maintained entitlement catalogue provides the necessary building blocks to define and maintain a role model."}],"downstream":[{"id":"D4-09","relation":"enables","rationale":"Defining and maintaining role-based access control is required before roles can be mapped to job functions and enforced."},{"id":"D4-13","relation":"enables","rationale":"Defining and maintaining role-based access control provides the structure necessary to enforce least privilege across accounts."}]},"D4-08":{"type":"Preventive","typeReason":"The control aims to proactively centralize access to prevent the persistence of decentralized, unmanaged access.","hierarchy":"Substitution","hierarchyReason":"Centralised access control replaces fragmented local administration with a safer common control mechanism.","effect":"Likelihood","effectReason":"Centralizing access control prevents unauthorized access incidents, reducing the likelihood of compromise.","upstream":[{"id":"D1-02","relation":"enables","rationale":"Tier definitions dictate the required rigor for centralized access control across systems."}],"downstream":[{"id":"D7-05","relation":"shared_dependency","rationale":"Centralised access control systems require centrally managed directory services to function cohesively."}]},"D4-09":{"type":"Preventive","typeReason":"The control prevents incorrect access by technically enforcing the mapping of roles to job functions.","hierarchy":"Engineering","hierarchyReason":"The control technically enforces role mappings in the system, which aligns with Engineering controls.","effect":"Likelihood","effectReason":"Enforcing role mappings directly prevents incorrect access from being granted, thereby reducing the likelihood of a breach.","upstream":[{"id":"D4-07","relation":"enables","rationale":"Defining and maintaining role-based access control is required before roles can be mapped to job functions and enforced."}],"downstream":[{"id":"D4-13","relation":"enables","rationale":"Mapping roles to job functions enables the application of least privilege by defining what privileges are required."},{"id":"D4-18","relation":"enables","rationale":"Mapping roles to job functions provides the business context needed to identify which duties actually conflict."}]},"D4-10":{"type":"Directive","typeReason":"The control directs the definition and documentation of attribute-based rules where ABAC is used.","hierarchy":"Administrative","hierarchyReason":"Defining and documenting rules is a manual process and policy mandate, mapping to Administrative controls.","effect":"Likelihood","effectReason":"Documenting ABAC rules reduces the likelihood of invisible or unmanageable logic causing access errors.","upstream":[{"id":"D7-16","relation":"requires","rationale":"ABAC rules require identity attributes to be validated at source to function reliably."}],"downstream":[]},"D4-11":{"type":"Detective","typeReason":"Discovers roles invalidated by organizational change rather than preventing the change or automatically enforcing access.","hierarchy":"Administrative","hierarchyReason":"Relies on manual review processes by owners rather than automated technical enforcement.","effect":"Likelihood","effectReason":"Detects obsolete roles that grant excessive access, reducing the likelihood of inappropriate access being exploited.","upstream":[{"id":"D1-06","relation":"requires","rationale":"System and data owners must be identified to perform the role review on organizational change."}],"downstream":[]},"D4-12":{"type":"Preventive","typeReason":"The control requires approval before access is assigned, making it a preventive measure that stops unauthorized access from occurring.","hierarchy":"Administrative","hierarchyReason":"This is an administrative control as it relies on human process, oversight, and manual approval rather than automated technical enforcement.","effect":"Likelihood","effectReason":"This control prevents unauthorized access by requiring approval before access is granted, directly reducing the likelihood of a breach.","upstream":[{"id":"D1-06","relation":"enables","rationale":"Identifying system and data owners enables them to perform the required access approvals."}],"downstream":[]},"D4-13":{"type":"Preventive","typeReason":"Applying least privilege prevents unauthorized actions by ensuring accounts cannot perform functions beyond their required scope.","hierarchy":"Engineering","hierarchyReason":"Least privilege is a technically enforced safeguard that restricts user capabilities within the system.","effect":"Both","effectReason":"Restricting accounts to only required privileges prevents excessive damage during a compromise, reducing both the likelihood of successful exploitation and the resulting consequence.","upstream":[{"id":"D4-09","relation":"enables","rationale":"Mapping roles to job functions enables the application of least privilege by defining what privileges are required."},{"id":"D4-07","relation":"enables","rationale":"Defining and maintaining role-based access control provides the structure necessary to enforce least privilege across accounts."}],"downstream":[{"id":"D4-14","relation":"enables","rationale":"The definition of least privilege enables the separation of administrative rights."}]},"D4-14":{"type":"Preventive","typeReason":"The control proactively prevents the combination of routine access and administrative privilege on a single account.","hierarchy":"Engineering","hierarchyReason":"The control requires technical separation (dedicated accounts), relying on system configuration to prevent everyday accounts from holding administrative rights.","effect":"Likelihood","effectReason":"By preventing administrative privileges on daily-use accounts, the control reduces the likelihood of compromise via routine threats like phishing.","upstream":[{"id":"D4-13","relation":"enables","rationale":"The definition of least privilege enables the separation of administrative rights."}],"downstream":[{"id":"D4-16","relation":"requires","rationale":"Dedicated administrative accounts are required to establish the boundary that prohibits non-privileged users from privileged functions."}]},"D4-15":{"type":"Preventi ierarchyReason":"A managed vault replaces unmanaged storage or direct knowledge of privileged credentials.","effect":"Likelihood","effectReason":"Holding credentials in a managed vault directly reduces the likelihood of unauthorized access and credential theft.","upstream":[{"id":"D5-01","relation":"requires","rationale":"Vaulting privileged credentials requires the prior discovery and inventory of those privileged accounts."}],"downstream":[{"id":"D3-14","relation":"enables","rationale":"The managed vault provides the runtime secret store required to replace static credentials in code."},{"id":"D5-07","relation":"requires","rationale":"Vault access MFA inherently requires that the privileged credentials are held in a managed vault first."},{"id":"D5-08","relation":"requires","rationale":"Logging checkouts from a vault requires the credentials to be held in a managed vault first."},{"id":"D5-09","relation":"enables","rationale":"Holding credentials in a managed vault provides the technical capability to automate rotation."}]},"D5-07":{"type":"Preventive","typeReason":"The control requires MFA to be enforced before access is granted, acting as a barrier to prevent unauthorized entry.","hierarchy":"Engineering","hierarchyReason":"MFA is an automated, technically enforced safeguard built into the system to prevent unauthorized access.","effect":"Likelihood","effectReason":"MFA enforcement reduces the likelihood of an attacker successfully authenticating to the vault using compromised passwords.","upstream":[{"id":"D1-03","relation":"enables","rationale":"The authentication standard mandates MFA requirements, providing the policy basis that enables enforcement on the vault."},{"id":"D5-06","relation":"requires","rationale":"Vault access MFA inherently requires that the privileged credentials are held in a managed vault first."},{"id":"D3-05","relation":"enables","rationale":"The enterprise administrative MFA capability enables the vault to enforce multi-factor authentic
