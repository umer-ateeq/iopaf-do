in:0}.cw-meta{font-family:var(--mono);font-size:7px;color:#748596;margin-top:4px}.cw-nav{display:flex;gap:4px}.cw-nav button{border:1px solid #cbd7e1;background:#fff;color:#536b7e;padding:5px 7px;font-size:8px;font-weight:800;cursor:pointer}.cw-question{margin:9px 0;border-left:4px solid #0e8a7d;background:#edf9f7;padding:9px 10px}.cw-question b{display:block;font-size:10.5px;line-height:1.4;color:#153b57}.cw-question span{display:block;font-family:var(--mono);font-size:7px;color:#6c8092;margin-top:3px}.cw-assess{display:grid;grid-template-columns:1.05fr .95fr;gap:9px}.cw-panel{border:1px solid #d9e3eb;background:#fff;padding:9px}.cw-panel-hd{font-family:var(--mono);font-size:7px;font-weight:800;letter-spacing:.08em;color:#657a8c;margin-bottom:7px}.cw-status{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #d6e0e8}.cw-status button{border:0;border-right:1px solid #d6e0e8;background:#fff;color:#657789;padding:6px 2px;font-size:7.5px;font-weight:800;cursor:pointer}.cw-status button.on{background:#e8f7f4;color:#076c62;box-shadow:inset 0 -3px #0e8a7d}.cw-scale{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}.cw-scale button{border:1px solid #ced9e2;background:#fff;color:#5e7183;padding:7px 2px;font-family:var(--mono);font-size:8px;cursor:pointer}.cw-scale button.on{background:#0b2e52;color:#fff;border-color:#0b2e52}.cw-scale button.na{color:#75889a}.cw-evidence{display:grid;grid-template-columns:1.15fr .75fr .75fr .75fr;gap:5px}.cw-field{border:1px solid #dbe4eb;background:#f9fbfc;padding:6px}.cw-field label{display:block;font-family:var(--mono);font-size:6.5px;color:#7b8c9c;letter-spacing:.04em}.cw-field input,.cw-field select{width:100%;border:0;background:transparent;font-size:8.5px;margin-top:3px;outline:none}.cw-posterior{margin-top:7px;border-left:4px solid #b42332;background:#fff5f6;padding:7px}.cw-posterior-grid{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}.cw-posterior strong{font-size:20px;color:#b42332}.cw-posterior span{font-size:8px;color:#65798b;line-height:1.4}.cw-dist{display:flex;height:11px;border:1px solid #d5e0e8;margin-top:5px}.cw-dist i{display:block;height:100%}.cw-dist-label{display:grid;grid-template-columns:repeat(5,1fr);font-family:var(--mono);font-size:6px;color:#748596;margin-top:2px}.cw-req{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.cw-req>div{border-top:3px solid #5b7890;background:#fff;border-left:1px solid #dce4eb;border-right:1px solid #dce4eb;border-bottom:1px solid #dce4eb;padding:8px;min-height:74px}.cw-req>div:nth-child(2),.cw-req>div:nth-child(3){border-top-color:#0e8a7d}.cw-req>div:nth-child(4){border-top-color:#2563a6}.cw-req label{font-family:var(--mono);font-size:6.8px;font-weight:800;color:#718395}.cw-req p{font-size:8.5px;color:#40586d;line-height:1.42;margin:4px 0 0}.cw-bottom{display:grid;grid-template-columns:1.2fr .8fr;gap:7px;margin-top:8px}.cw-bottom label{display:block;font-family:var(--mono);font-size:6.8px;color:#718395}.cw-bottom textarea,.cw-bottom input,.cw-bottom select{width:100%;font-size:8.5px;margin-top:3px}.cw-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cw-compare{margin-top:8px;border:1px solid #dce4eb;background:#fff}.cw-compare-hd{display:flex;justify-content:space-between;padding:7px 8px;border-bottom:1px solid #e0e7ed}.cw-compare-hd b{font-size:9px;color:#173c57}.cw-compare-hd span{font-family:var(--mono);font-size:6.5px;color:#778899}.cw-compare-row{display:grid;grid-template-columns:minmax(150px,1.4fr) .8fr .6fr .7fr .9fr;gap:5px;padding:5px 8px;border-top:1px solid #edf1f4;font-size:7.7px;align-items:center}.cw-compare-row:first-of-type{border-top:0}.cw-compare-row .bad{color:#b42332;font-weight:800}.cw-empty{padding:20px;color:#66798b;font-size:10px}.cw-classic-switch{display:flex;justify-content:flex-end;margin-bottom:8px}

@media(max-width:900px){.topbar{height:auto;min-height:58px;flex-wrap:wrap;gap:5px;padding:7px 10px}.topbar .brand{flex:1 1 auto}.topbar .top-right{order:2;flex:1 1 100%;margin-left:0;justify-content:flex-end;gap:5px}.topbar .top-gauge{display:none}.topbar .io-btn,.topbar .dl-btn{font-size:9px;padding:5px 8px}.topbar .nav{order:3;width:100%;margin-left:0;overflow-x:auto;gap:1px;padding-top:2px}.topbar .nav button{flex:0 0 auto;font-size:10px;padding:6px 8px}.cw-layout{grid-template-columns:1fr}.cw-domains{display:grid;grid-template-columns:repeat(2,1fr);border-right:0}.cw-domain{border:1px solid #e1e8ee}.cw-queue{border-right:0}.cw-list{max-height:330px}.cw-context{grid-template-columns:1fr}.cw-assess,.cw-req,.cw-bottom{grid-template-columns:1fr}.cw-compare-row{grid-template-columns:minmax(110px,1.2fr) .8fr .5fr .6fr .8fr}.cw-topline{flex-direction:column}.cw-switch{width:100%;flex-wrap:wrap}.cw-work{padding:8px}.cw-head{flex-direction:column}.cw-status{grid-template-columns:1fr 1fr}.cw-evidence{grid-template-columns:1fr 1fr}}
</style>
<script>
(()=>{
  const classicRenderControls=renderControls;
  const levels=['enterprise','iam','infra','network','database','platform','cloud','application','api'];
  const levelNames={enterprise:'Overall',iam:'Shared IAM',infra:'Infrastructure',network:'Network',database:'Database',platform:'Platform',cloud:'Cloud',application:'Application',api:'API'};
  iamRiskState.controlsUI=iamRiskState.controlsUI||{view:'focus',domain:'D1',control:'D1-01',missingEvidence:false};

  function obj(){return iamObject(iamSelectedObject);}
  function applies(c){const on=iamStdsOn();return (c.fw.some(f=>on.includes(f))||!c.fw.length)&&iamControlApplies(c,obj());}
  function score(c){const r=iamGetResponse(iamSelectedObject,c.id);if(r.implementation==='na')return {raw:'na',eff:null,capped:false,gap:null};if(r.maturity===null)return {raw:null,eff:null,capped:false,gap:null};let eff=Number(r.maturity),capped=false;if(r.evidence==='none'&&eff>=c.ev){eff=Math.max(0,c.ev-1);capped=true;}return {raw:Number(r.maturity),eff,capped,gap:Math.max(0,4-eff)};}
  function shownControls(){const ui=iamRiskState.controlsUI;return IAMCTL.filter(c=>applies(c)&&c.d===ui.domain).filter(c=>{const s=score(c),r=iamGetResponse(iamSelectedObject,c.id);if(ctlFilter){const q=ctlFilter.toLowerCase();if(![c.id,c.s,c.g,c.src,c.o].join(' ').toLowerCase().includes(q))return false;}if(ctlOnlyGaps&&!(s.eff!==null&&s.eff<4))return false;if(ctlOnlyUnrated&&s.raw!==null)return false;if(ui.missingEvidence&&!(s.raw!==null&&s.raw!=='na'&&r.evidence==='none'))return false;return true;});}
  function setView(v){iamRiskState.controlsUI.view=v;persist();renderControls();}
  function setDomain(d){iamRiskState.controlsUI.domain=d;const first=IAMCTL.find(c=>c.d===d&&applies(c));if(first)iamRiskState.controlsUI.control=first.id;persist();renderControls();}
  function setControl(id){iamRiskState.controlsUI.control=id;iamSelectedControl=id;persist();renderControls();}
  function move(delta){const list=shownControls(),i=Math.max(0,list.findIndex(c=>c.id===iamRiskState.controlsUI.control)),n=list[v9clamp(i+delta,0,list.length-1)];if(n)setControl(n.id);}
  function toggleMissing(){iamRiskState.controlsUI.missingEvidence=!iamRiskState.controlsUI.missingEvidence;persist();renderControls();}
  function targetOptions(){const type=IOPAF_SCOPE.currentLevel(),list=type==='enterprise'?[iamObject('legacy')]:iamObjects.filter(o=>o.type===type&&!o.legacy);return list.map(o=>`<option value="${o.id}" ${o.id===iamSelectedObject?'selected':''}>${v9esc(o.name)}</option>`).join('');}
  function domainStats(d){const list=IAMCTL.filter(c=>c.d===d&&applies(c)),rated=list.filter(c=>score(c).raw!==null),gaps=list.filter(c=>{const s=score(c);return s.eff!==null&&s.eff<4;});return {total:list.length,rated:rated.length,gaps:gaps.length};}
  function implementationButtons(c,r){return [['meets','Meets'],['partially','Partial'],['does-not-meet','Does not meet'],['not-tested','Not tested']].map(x=>`<button class="${r.implementation===x[0]?'on':''}" onclick="IOPAF_SCOPE.field('${c.id}','implementation','${x[0]}')">${x[1]}</button>`).join('');}
  function dist(p){return `<div class="cw-dist">${p.dist.map((v,i)=>`<i style="width:${v}%;background:${IAM_EFF_COL[i]}"></i>`).join('')}</div><div class="cw-dist-label">${p.dist.map((v,i)=>`<span>${v}% ${IAM_EFF_SHORT[i]}</span>`).join('')}</div>`;}
  function comparison(c){const rows=iamObjects.filter(o=>iamControlApplies(c,o)).map(o=>{const r=iamGetResponse(o.id,c.id),p=iamEffectiveness(o.id,c.id),s=r.maturity===null?null:(r.evidence==='none'&&r.maturity>=c.ev?c.ev-1:r.maturity);return `<button class="cw-compare-row" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:${o.id===iamSelectedObject?'#eef9f7':'#fff'};text-align:left;cursor:pointer" onclick="IOPAF_SCOPE.selectTarget('${o.id}')"><b>${v9esc(o.legacy?'Overall / legacy':o.name)}</b><span>${v9esc(iamObjectType(o.type).name)}</span><span>${r.maturity===null?'—':'L'+r.maturity}</span><span>${r.tested?r.exceptions+'/'+r.tested:'Prior'}</span><span class="${p.mean>.3?'bad':''}">${Math.round(p.mean*100)}% failure</span></button>`;}).join('');return `<div class="cw-compare"><div class="cw-compare-hd"><b>Same control · different target truth</b><span>SELECT A ROW TO SWITCH CONTEXT</span></div>${rows||'<div class="cw-empty">No other applicable targets are registered.</div>'}</div>`;}
  function work(c,list){if(!c)return '<div class="cw-empty">No controls match the current filters for this assessment context.</div>';const r=iamGetResponse(iamSelectedObject,c.id),p=iamEffectiveness(iamSelectedObject,c.id),s=score(c),D=IAM_DOMAINS.find(d=>d.c===c.d),dt=(typeof IAMDET!=='undefined'&&IAMDET[c.id])||{},act={a:r.action||'',o:r.owner||'',t:r.due||'',st:r.status||'Open'},idx=list.findIndex(x=>x.id===c.id);return `<div class="cw-head"><div class="cw-control"><span class="cw-id">${c.id}</span><div><h3>${v9esc(c.s)}</h3><div class="cw-meta">${v9esc(D.name)} · ${v9esc(c.g)} · ${v9esc(c.src)} · EVIDENCE GATE ≥ L${c.ev}</div></div></div><div class="cw-nav"><button ${idx<=0?'disabled':''} onclick="IOPAF_CONTROLS.move(-1)">← Previous</button><button ${idx>=list.length-1?'disabled':''} onclick="IOPAF_CONTROLS.move(1)">Next →</button></div></div><div class="cw-question"><b>${v9esc(iamControlQuestion(c,obj()))}</b><span>${v9esc(obj().name)} · ${v9esc(iamObjectType(obj().type).name)} · ${v9esc(obj().environment||'—')} · ${v9esc(obj().criticality||'T2')}</span></div><div class="cw-assess"><section class="cw-panel"><div class="cw-panel-hd">1 · COMPLIANCE AND MATURITY</div><div class="cw-status">${implementationButtons(c,r)}</div><div class="cw-scale">${[0,1,2,3,4,5].map(v=>`<button class="${r.maturity===v?'on':''}" onclick="setIamR('${c.id}','${v}')">L${v}</button>`).join('')}<button class="na ${r.implementation==='na'?'on':''}" onclick="setIamR('${c.id}','na')">N/A</button></div><div style="font-size:8px;color:${s.capped?'#866016':'#6c7e8f'};margin-top:6px">${s.raw===null?'Not yet rated for this target.':s.raw==='na'?'Not applicable; excluded from this target roll-up.':s.capped?'Claim capped at L'+s.eff+' until evidence is recorded.':'Effective maturity: L'+s.eff+'.'}</div></section><section class="cw-panel"><div class="cw-panel-hd">2 · EVIDENCE AND EFFECTIVENESS</div><div class="cw-evidence"><div class="cw-field"><label>EVIDENCE STRENGTH</label><select onchange="IOPAF_SCOPE.field('${c.id}','evidence',this.value)">${[['none','None'],['design','Design only'],['sampled','Sampled test'],['measured','Measured'],['continuous','Continuous']].map(x=>`<option value="${x[0]}" ${r.evidence===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="cw-field"><label>POPULATION</label><input type="number" min="0" value="${r.totalPaths||''}" onchange="IOPAF_SCOPE.field('${c.id}','totalPaths',this.value)"></div><div class="cw-field"><label>TESTED</label><input type="number" min="0" value="${r.tested||''}" onchange="IOPAF_SCOPE.field('${c.id}','tested',this.value)"></div><div class="cw-field"><label>EXCEPTIONS</label><input type="number" min="0" value="${r.exceptions||''}" onchange="IOPAF_SCOPE.field('${c.id}','exceptions',this.value)"></div></div><div class="cw-posterior"><div class="cw-posterior-grid"><strong>${Math.round(p.mean*100)}%</strong><span><b>posterior failure</b><br>95% credible range ${Math.round(p.lo*100)}–${Math.round(p.hi*100)}% · ${IAM_EFF_LABELS[p.dist.indexOf(Math.max(...p.dist))]}</span></div>${dist(p)}</div></section></div><div class="cw-req"><div><label>WHY IT EXISTS</label><p>${v9esc(dt.i||'—')}</p></div><div><label>WHAT GOOD LOOKS LIKE</label><p>${v9esc(dt.e||'—')}</p></div><div><label>EVIDENCE TO REQUEST</label><p>${v9esc(dt.v||'—')}</p></div><div><label>HOW TO TEST · n = ${c.n}</label><p>${v9esc(dt.t||'—')}</p></div></div><div class="cw-bottom"><section class="cw-panel"><div class="cw-panel-hd">3 · TESTER NOTE AND EVIDENCE REFERENCE</div><textarea rows="3" placeholder="System, extract, sample, tester and date" oninput="setIamNote('${c.id}',this.value)">${v9esc(r.note||'')}</textarea></section><section class="cw-panel"><div class="cw-panel-hd">4 · REMEDIATION</div><div class="cw-action-grid"><label>Action<input value="${v9esc(act.a)}" oninput="setIamAct('${c.id}','a',this.value)"></label><label>Owner<input value="${v9esc(act.o)}" oninput="setIamAct('${c.id}','o',this.value)"></label><label>Due<input type="date" value="${v9esc(act.t)}" onchange="setIamAct('${c.id}','t',this.value)"></label><label>Status<select onchange="setIamAct('${c.id}','st',this.value)">${['Open','In progress','Blocked','Done'].map(x=>`<option ${act.st===x?'selected':''}>${x}</option>`).join('')}</select></label></div></section></div>${comparison(c)}`;}
  function renderFocus(){const ui=iamRiskState.controlsUI,o=obj(),all=IAMCTL.filter(applies),domainList=shownControls();let c=domainList.find(x=>x.id===ui.control);if(!c)c=domainList[0]||all[0];if(c){ui.control=c.id;ui.domain=c.d;iamSelectedControl=c.id;}const stats=all.map(score),rated=stats.filter(s=>s.raw!==null).length,gaps=stats.filter(s=>s.eff!==null&&s.eff<4).length,evidenced=all.filter(c=>iamGetResponse(iamSelectedObject,c.id).evidence!=='none').length;const targetList=IOPAF_SCOPE.currentLevel()==='enterprise'?[iamObject('legacy')]:iamObjects.filter(x=>x.type===IOPAF_SCOPE.currentLevel()&&!x.legacy);return `<div class="cw-shell"><div class="cw-top"><div class="cw-topline"><div><div class="cw-ey">CONTROL ASSURANCE · FOCUSED ASSESSMENT</div><div class="cw-title">${v9esc(o.name)}</div><div class="cw-sub">${v9esc(iamObjectType(o.type).name)} · ${all.length} applicable controls · ${rated} rated · ${evidenced} evidenced · ${gaps} below L4</div></div><div class="cw-switch"><button class="on">Focused assessment</button><button onclick="IOPAF_CONTROLS.view('register')">Full register</button><button onclick="iamExportObjectCSV()">Export</button></div></div><div class="cw-context"><div class="cw-levels">${levels.map(t=>`<button class="${IOPAF_SCOPE.currentLevel()===t?'on':''}" onclick="IOPAF_SCOPE.selectLevel('${t}')">${levelNames[t]}</button>`).join('')}</div><div class="cw-target"><label>NAMED TARGET</label><select onchange="IOPAF_SCOPE.selectTarget(this.value)">${targetOptions()}</select></div><div class="cw-progress"><b>${rated}/${all.length}</b><span>RATED · ${evidenced} EVIDENCED</span></div></div></div><div class="cw-layout"><nav class="cw-domains"><div class="hd">CONTROL DOMAINS</div>${IAM_DOMAINS.map(D=>{const st=domainStats(D.c);return `<button class="cw-domain ${ui.domain===D.c?'on':''}" onclick="IOPAF_CONTROLS.domain('${D.c}')"><span class="code">${D.c}</span><span><b>${v9esc(D.name)}</b><small><i>${st.rated}/${st.total} rated</i><i>${st.gaps} gaps</i></small></span></button>`;}).join('')}</nav><aside class="cw-queue"><div class="cw-tools"><div class="cw-search"><label>FIND A CONTROL</label><input type="search" value="${v9esc(ctlFilter||'')}" oninput="setCtlFilter(this.value)" placeholder="ID, statement, source or owner"></div><div class="cw-filter"><button class="${ctlOnlyGaps?'on':''}" onclick="toggleCtlFlag('gaps')">Gaps</button><button class="${ctlOnlyUnrated?'on':''}" onclick="toggleCtlFlag('unrated')">Unrated</button><button class="${ui.missingEvidence?'on':''}" onclick="IOPAF_CONTROLS.missing()">Missing evidence</button><button onclick="ctlNextUnrated()">Next unrated</button></div></div><div class="cw-list">${(()=>{let last='';return domainList.map(x=>{const s=score(x),r=iamGetResponse(iamSelectedObject,x.id),group=x.g!==last?(last=x.g,`<div class="cw-group">${v9esc(x.g)}</div>`):'';return group+`<button class="cw-item ${c&&c.id===x.id?'on':''}" onclick="IOPAF_CONTROLS.control('${x.id}')"><div class="cw-item-top"><code>${x.id}</code><span class="state ${s.eff!==null&&s.eff<4?'gap':''}">${r.implementation==='na'?'N/A':s.eff===null?'UNRATED':'L'+s.eff+(r.evidence==='none'?' · NO EV':' · EVIDENCED')}</span></div><p>${v9esc(x.s)}</p></button>`;}).join('')||'<div class="cw-empty">No controls match these filters.</div>';})()}</div></aside><main class="cw-work">${work(c,domainList)}</main></div></div>`;}

  renderControls=function(){const head=document.getElementById('ctl-head'),body=document.getElementById('ctl-body');if(!head||!body)return;if(iamRiskState.controlsUI.view==='register'){classicRenderControls();if(head)head.insertAdjacentHTML('afterbegin','<div class="cw-classic-switch"><button class="dl-btn" onclick="IOPAF_CONTROLS.view(\'focus\')">← Focused assessment</button></div>');return;}head.innerHTML='';body.innerHTML=renderFocus();};
  globalThis.IOPAF_CONTROLS={view:setView,domain:setDomain,control:setControl,move,missing:toggleMissing};
  persist();const current=document.querySelector('.view.on');if(current&&current.id==='view-controls')renderControls();
})();
</script>
