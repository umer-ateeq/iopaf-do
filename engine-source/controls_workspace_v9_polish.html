<style id="iopaf-v9-controls-polish-styles">
/* Assurance Graph polish: one evidence path, strict color semantics */
#view-controls .sec-head{grid-template-columns:1fr;max-width:940px;margin-bottom:8px}#view-controls .sec-head .num{display:none}#view-controls .sec-head .tx{padding-left:0}#view-controls .sec-head .lede{max-width:920px}#view-controls .sec-rule{margin-top:8px;margin-bottom:16px}
.cw-shell{box-shadow:0 10px 30px rgba(11,46,82,.08);border-color:#bfcfda}.cw-top{border-top:4px solid #0b2e52}.cw-ey{color:#08756b}.cw-title{font-size:18px}.cw-domain .code{background:#0b2e52}.cw-domain.on .code{background:#0e8a7d}.cw-head{border-left:4px solid #0e8a7d;background:#f4f8fa;padding:8px}.cw-req>div{border-top-color:#0b2e52}.cw-req>div:nth-child(2),.cw-req>div:nth-child(3){border-top-color:#0e8a7d}.cw-req>div:nth-child(4){border-top-color:#0b2e52}.cw-trace{display:grid;grid-template-columns:1.2fr 34px 1.25fr 34px 1fr;align-items:stretch;margin:8px 0 9px}.cw-trace-node{border:1px solid #c9d7e1;border-top:3px solid #0b2e52;background:#fff;padding:6px 7px;min-width:0}.cw-trace-node.assurance{border-top-color:#0e8a7d}.cw-trace-node.risk{border-top-color:#b42332}.cw-trace-node label{display:block;font-family:var(--mono);font-size:6.3px;letter-spacing:.08em;color:#7a8b9a}.cw-trace-node b{display:block;font-size:8.3px;line-height:1.25;color:#173b55;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cw-trace-node.risk b{color:#b42332}.cw-trace-node span{display:block;font-family:var(--mono);font-size:6.3px;color:#718395;margin-top:2px}.cw-trace-arrow{display:flex;align-items:center;justify-content:center;color:#0e8a7d;font-size:16px;font-weight:800}.cw-work:before{content:'TRACEABLE ASSURANCE PATH';display:block;font-family:var(--mono);font-size:6.5px;letter-spacing:.1em;color:#0e8a7d;margin-bottom:5px}.cw-panel-hd,.cw-group,.cw-meta,.cw-ey{letter-spacing:.09em}.cw-compare{border-top:3px solid #0b2e52}.cw-compare-row[style*="eef9f7"]{box-shadow:inset 4px 0 #0e8a7d}.cw-progress b{font-family:var(--disp);font-size:18px}.cw-filter button.on{background:#0b2e52}.cw-switch button.on{background:#0b2e52}.cw-posterior{border-left-color:#b42332}.cw-item.on{background:#ecf8f6}.cw-context{border-top:1px solid #e0e8ee;padding-top:8px}.cw-topline .cw-sub{max-width:760px}
@media(max-width:900px){#view-controls .sec-head{margin-bottom:5px}.cw-trace{grid-template-columns:1fr 18px 1fr;gap:0}.cw-trace-node:nth-of-type(n+4),.cw-trace-arrow:nth-of-type(n+4){margin-top:5px}.cw-trace{display:flex;overflow-x:auto}.cw-trace-node{flex:0 0 145px}.cw-trace-arrow{flex:0 0 20px}}
</style>
<script>
(()=>{
  const controlsBeforePolish=renderControls;
  function addTrace(){const shell=document.querySelector('.cw-shell');if(!shell)return;const work=shell.querySelector('.cw-work'),q=work&&work.querySelector('.cw-question');if(!q||work.querySelector('.cw-trace'))return;const ui=iamRiskState.controlsUI||{},c=iamCtl(ui.control),o=iamObject(iamSelectedObject);if(!c||!o)return;const r=iamGetResponse(o.id,c.id),p=iamEffectiveness(o.id,c.id),eff=IAM_EFF_LABELS[p.dist.indexOf(Math.max(...p.dist))],evidence=r.evidence==='none'?'Prior only':r.evidence+(r.tested?' · '+r.tested+' tested':'');const action=r.action?r.status||'Open':r.maturity===null?'Assessment required':p.mean>.3?'Treat control gap':'Monitor assurance';q.insertAdjacentHTML('afterend',`<div class="cw-trace" aria-label="Traceable assurance path"><div class="cw-trace-node"><label>01 · TARGET AND CONTROL</label><b>${v9esc(o.name)} · ${c.id}</b><span>${v9esc(c.s)} · ${v9esc(c.src)}</span></div><div class="cw-trace-arrow">→</div><div class="cw-trace-node risk"><label>02 · EVIDENCE TO POSTERIOR</label><b>${v9esc(evidence)} → ${Math.round(p.mean*100)}% failure</b><span>${r.exceptions||0} exceptions / ${r.tested||0} tested · 95% ${Math.round(p.lo*100)}–${Math.round(p.hi*100)}% · ${v9esc(eff)}</span></div><div class="cw-trace-arrow">→</div><div class="cw-trace-node assurance"><label>03 · DECISION AND ACTION</label><b>${v9esc(action)}</b><span>${r.owner?v9esc(r.owner):'Accountable owner not assigned'}</span></div></div>`);}
  function polishCopy(){const ey=document.querySelector('.cw-ey');if(ey)ey.textContent='CONTROL ASSURANCE · FOCUSED EVIDENCE LEDGER';const target=document.querySelector('.cw-target label');if(target)target.textContent='DECISION TARGET';const find=document.querySelector('.cw-search label');if(find)find.textContent='FIND CONTROL, SOURCE OR ACCOUNTABLE OWNER';const missing=[...document.querySelectorAll('.cw-filter button')].find(b=>b.textContent.trim()==='Missing evidence');if(missing)missing.textContent='Evidence gaps';}
  renderControls=function(){controlsBeforePolish();addTrace();polishCopy();};
  const current=document.querySelector('.view.on');if(current&&current.id==='view-controls')renderControls();
})();
</script>
