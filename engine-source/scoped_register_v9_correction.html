<style id="iopaf-v9-scoped-styles">
/* Corrective release: established Controls register + selected assessment level */
.v9-scope-ribbon{border:1px solid #cbd9e4;border-left:4px solid #0e8a7d;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px}.v9-scope-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}.v9-scope-top .ey{font-family:var(--mono);font-size:8px;font-weight:800;letter-spacing:.1em;color:#0e8a7d}.v9-scope-top h3{font-size:15px;color:#0b2e52;margin:3px 0}.v9-scope-top p{font-size:10px;line-height:1.45;color:#65778a;margin:0;max-width:730px}.v9-scope-levels{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}.v9-scope-levels button{border:1px solid #c9d6e1;background:#fff;color:#51677a;border-radius:5px;padding:6px 8px;font-size:9px;font-weight:800;cursor:pointer}.v9-scope-levels button.on{background:#0b2e52;border-color:#0b2e52;color:#fff}.v9-scope-select{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid #e5ebf0}.v9-scope-select label{font-family:var(--mono);font-size:8px;color:#718294;letter-spacing:.07em}.v9-scope-select select{min-width:260px;font-size:10px}.v9-scope-state{margin-left:auto;font-family:var(--mono);font-size:8px;padding:4px 6px;border:1px solid #b7d9d4;color:#0b746a;background:#eff9f7}.v9-scope-state.off{border-color:#d7c493;background:#fffaf0;color:#866016}.v9-row-context{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:5px 12px 6px 69px;border-top:1px dashed #e3eaf0;background:#fbfdfe}.v9-row-context .lab{font-family:var(--mono);font-size:7px;letter-spacing:.07em;color:#7d8d9d}.v9-row-context button{border:1px solid #d0dbe4;background:#fff;color:#536a7e;border-radius:4px;padding:3px 6px;font-size:8px;cursor:pointer}.v9-row-context button.on{border-color:#0e8a7d;color:#086b62;background:#eaf8f6;font-weight:800}.v9-row-context button.na{opacity:.55}.v9-context-question{border-left:4px solid #0e8a7d;background:#edf9f7;padding:9px 11px;margin:0 0 10px}.v9-context-question b{display:block;font-size:11px;color:#113a57;line-height:1.4}.v9-context-question span{display:block;font-family:var(--mono);font-size:7.5px;color:#64788a;margin-top:3px}.v9-test-panel{border:1px solid #d8e3eb;background:#f8fbfd;padding:9px 10px;margin-top:9px}.v9-test-grid{display:grid;grid-template-columns:1.1fr .8fr .8fr .8fr 1fr;gap:6px}.v9-test-grid label{font-family:var(--mono);font-size:7px;letter-spacing:.05em;color:#7b8b9a}.v9-test-grid input,.v9-test-grid select{display:block;width:100%;margin-top:3px;font-family:var(--sans);font-size:9px}.v9-post{border-left:3px solid #b42332;padding-left:7px}.v9-post b{display:block;color:#b42332;font-size:14px}.v9-post span{font-family:var(--mono);font-size:7px;color:#718294}.v9-prior-banner{border:1px solid #bfd8e5;background:#f0f8fb;color:#405f76;padding:8px 10px;margin-bottom:9px;font-size:9px;line-height:1.45}.v9-prior-banner b{color:#0b2e52}.v9-risk-empty-guard{border:1px solid #cbd9e4;background:#fff;padding:15px;color:#536a7e}.v9-risk-empty-guard b{display:block;color:#0b2e52;margin-bottom:4px}
@media(max-width:1000px){.v9-test-grid{grid-template-columns:1fr 1fr}.v9-row-context{padding-left:12px}.v9-scope-state{margin-left:0}}
</style>
<script>
/* Corrective release: scope lives inside the established Controls worksheet. */
(()=>{
  const baseIamInScope=iamInScope,baseIamScore=iamScore,replacedControls=renderControls,baseBuildRisk=iamBuildRiskModel,baseRenderRisk=renderBayesianRisk;
  let scopedRendering=false;
  const levelOrder=['enterprise','iam','infra','network','database','platform','cloud','application','api'];
  const levelShort={enterprise:'Overall',iam:'Shared IAM',infra:'Infrastructure',network:'Network',database:'Database',platform:'Platform',cloud:'Cloud',application:'Application',api:'API'};
  const levelPlaceholder={iam:'Shared IAM service — define target',infra:'Infrastructure level — define target',network:'Network level — define target',database:'Database level — define target',platform:'Platform level — define target',cloud:'Cloud level — define target',application:'Application level — define target',api:'API / machine identity — define target'};

  function frameworkControlInScope(c){const on=iamStdsOn(),fw=c.fw.some(f=>on.includes(f))||c.fw.length===0,obj=iamObject(iamSelectedObject);return fw&&iamControlApplies(c,obj);}
  function scopedResponse(c){const r=iamGetResponse(iamSelectedObject,c.id);if(r.implementation==='na')return {raw:'na',eff:null,capped:false,gap:null};if(r.maturity===null)return {raw:null,eff:null,capped:false,gap:null};const raw=Number(r.maturity),held=r.evidence!=='none';let eff=raw,capped=false;if(!held&&raw>=c.ev){eff=Math.max(0,c.ev-1);capped=true;}return {raw,eff,capped,gap:Math.max(0,4-eff)};}
  function contextualMaps(){const R={},E={},N={},A={};IAMCTL.forEach(c=>{const r=iamGetResponse(iamSelectedObject,c.id);if(r.implementation==='na')R[c.id]='na';else if(r.maturity!==null)R[c.id]=Number(r.maturity);if(r.evidence!=='none')E[c.id]=true;if(r.note)N[c.id]=r.note;if(r.action||r.owner||r.due||r.status!=='Open')A[c.id]={a:r.action||'',o:r.owner||'',t:r.due||'',st:r.status||'Open'};});return {R,E,N,A};}
  function ensureLevelObject(type){if(type==='enterprise')return iamObject('legacy');let o=iamObjects.find(x=>x.type===type&&!x.legacy);if(!o){const id='level-'+type;o={id,name:levelPlaceholder[type]||iamObjectType(type).name,type,environment:'Define in Setup',criticality:'T2',owner:'',provider:'',legacy:false,placeholder:true};iamObjects.push(o);}return o;}
  function currentLevel(){const o=iamObject(iamSelectedObject);return !o||o.legacy?'enterprise':o.type;}
  function selectLevel(type){const o=ensureLevelObject(type);iamSelectedObject=o.id;iamRiskState.objectId=o.id;persist();renderControls();}
  function selectTarget(id){iamSelectedObject=id;iamRiskState.objectId=id;persist();renderControls();}
  function addTarget(){const type=currentLevel();if(type==='enterprise'){go('setup');return;}const name=prompt('Name this '+iamObjectType(type).name.toLowerCase()+' assessment target:','');if(!name||!name.trim())return;let id=v9slug(name),base=id,n=2;while(iamObjects.some(x=>x.id===id))id=base+'-'+n++;iamObjects.push({id,name:name.trim(),type,environment:'Production',criticality:'T2',owner:'',provider:'',legacy:false});iamSelectedObject=id;iamRiskState.objectId=id;persist();renderControls();}
  function targetOptions(){const type=currentLevel(),objects=type==='enterprise'?[iamObject('legacy')]:iamObjects.filter(o=>o.type===type&&!o.legacy);return objects.map(o=>`<option value="${o.id}" ${o.id===iamSelectedObject?'selected':''}>${v9esc(o.name)}${o.placeholder?' (rename in Setup)':''}</option>`).join('');}
  function scopeRibbon(){const obj=iamObject(iamSelectedObject),level=currentLevel(),active=streamActive('iam');return `<section class="v9-scope-ribbon"><div class="v9-scope-top"><div><div class="ey">CONTROL TESTING WORKSHEET · ASSESSMENT CONTEXT</div><h3>One familiar control form · separate answers where the control operates</h3><p>Select the level and named target before rating. The control statement, detailed requirement, evidence gate and remediation form remain unchanged; only the response context changes.</p></div><span class="v9-scope-state ${active?'':'off'}">${active?'IN SCOPE · CONTRIBUTES TO RESULTS':'IAM DISABLED · VIEWABLE, EXCLUDED FROM OFFICIAL ROLL-UP'}</span></div><div class="v9-scope-levels">${levelOrder.map(t=>`<button class="${level===t?'on':''}" onclick="IOPAF_SCOPE.selectLevel('${t}')">${levelShort[t]}</button>`).join('')}</div><div class="v9-scope-select"><label>NAMED TARGET</label><select onchange="IOPAF_SCOPE.selectTarget(this.value)">${targetOptions()}</select><button class="dl-btn" onclick="IOPAF_SCOPE.addTarget()">+ Add target</button><button class="dl-btn" onclick="go('setup')">Manage in Setup</button><span style="font-size:9px;color:#627589">Showing ${IAMCTL.filter(frameworkControlInScope).length} applicable controls for <b>${v9esc(obj.name)}</b>.</span></div></section>`;}
  function writeScoped(id,changes){const key=iamObjKey(iamSelectedObject,id),r=Object.assign(iamResponseTemplate(),iamObjResponses[key]||{},changes,{updated:new Date().toISOString()});iamObjResponses[key]=r;if(iamSelectedObject==='legacy'){if(r.implementation==='na')iamR[id]='na';else if(r.maturity===null)delete iamR[id];else iamR[id]=Number(r.maturity);if(r.evidence!=='none')iamEv[id]=true;else delete iamEv[id];if(r.note)iamNote[id]=r.note;else delete iamNote[id];iamAct[id]={a:r.action||'',o:r.owner||'',t:r.due||'',st:r.status||'Open'};}persist();renderControls();}
  function decorateRows(){const obj=iamObject(iamSelectedObject);IAMCTL.filter(frameworkControlInScope).forEach(c=>{const row=document.getElementById('ctlrow-'+c.id);if(!row)return;const verdict=row.querySelector('.ctl-r-verdict');if(verdict&&!row.querySelector('.v9-row-context')){const targets=iamObjects.filter(o=>iamControlApplies(c,o));const strip=document.createElement('div');strip.className='v9-row-context';strip.innerHTML=`<span class="lab">RESPONSES</span>${targets.map(o=>{const r=iamGetResponse(o.id,c.id);return `<button class="${o.id===iamSelectedObject?'on':''} ${r.maturity===null&&r.implementation!=='na'?'na':''}" onclick="IOPAF_SCOPE.selectTarget('${o.id}')">${v9esc(o.legacy?'Overall':o.name)} · ${r.implementation==='na'?'N/A':r.maturity===null?'—':'L'+r.maturity}</button>`;}).join('')}`;verdict.insertAdjacentElement('afterend',strip);}const detail=row.querySelector('.ctl-r-det');if(detail&&!detail.querySelector('.v9-context-question')){const r=iamGetResponse(obj.id,c.id),p=iamEffectiveness(obj.id,c.id),q=document.createElement('div');q.className='v9-context-question';q.innerHTML=`<b>${v9esc(iamControlQuestion(c,obj))}</b><span>${v9esc(iamObjectType(obj.type).name)} · ${v9esc(obj.environment||'—')} · ${v9esc(obj.criticality||'T2')} · ${iamControlProfile(c).mode.toUpperCase()} CONTROL</span>`;detail.insertAdjacentElement('afterbegin',q);const panel=document.createElement('div');panel.className='v9-test-panel';panel.innerHTML=`<div class="v9-test-grid"><label>EVIDENCE STRENGTH<select onchange="IOPAF_SCOPE.field('${c.id}','evidence',this.value)">${[['none','None'],['design','Design only'],['sampled','Sampled test'],['measured','Measured'],['continuous','Continuous']].map(x=>`<option value="${x[0]}" ${r.evidence===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label>PATHS / POPULATION<input type="number" min="0" value="${r.totalPaths||''}" onchange="IOPAF_SCOPE.field('${c.id}','totalPaths',this.value)"></label><label>TESTED<input type="number" min="0" value="${r.tested||''}" onchange="IOPAF_SCOPE.field('${c.id}','tested',this.value)"></label><label>EXCEPTIONS<input type="number" min="0" value="${r.exceptions||''}" onchange="IOPAF_SCOPE.field('${c.id}','exceptions',this.value)"></label><div class="v9-post">POSTERIOR FAILURE<b>${Math.round(p.mean*100)}%</b><span>95% · ${Math.round(p.lo*100)}–${Math.round(p.hi*100)}%</span></div></div>`;detail.appendChild(panel);}});}

  iamInScope=function(c){return scopedRendering?frameworkControlInScope(c):baseIamInScope(c);};
  iamScore=function(c){return scopedRendering?scopedResponse(c):baseIamScore(c);};
  setIamR=function(id,v){const r=iamGetResponse(iamSelectedObject,id);if(v==='')writeScoped(id,{maturity:null,implementation:'not-tested'});else if(v==='na')writeScoped(id,{maturity:null,implementation:'na'});else{const m=Number(v);writeScoped(id,{maturity:m,implementation:r.implementation==='inherited'?'inherited':m>=4?'meets':m>=2?'partially':'does-not-meet'});}};
  setIamEv=function(id,on){writeScoped(id,{evidence:on?'design':'none'});};
  setIamNote=function(id,v){const key=iamObjKey(iamSelectedObject,id),r=Object.assign(iamResponseTemplate(),iamObjResponses[key]||{});r.note=v||'';r.updated=new Date().toISOString();iamObjResponses[key]=r;if(iamSelectedObject==='legacy'){if(v)iamNote[id]=v;else delete iamNote[id];}persist();};
  setIamAct=function(id,k,v){const map={a:'action',o:'owner',t:'due',st:'status'},field=map[k]||k,key=iamObjKey(iamSelectedObject,id),r=Object.assign(iamResponseTemplate(),iamObjResponses[key]||{});r[field]=v;r.updated=new Date().toISOString();iamObjResponses[key]=r;if(iamSelectedObject==='legacy'){iamAct[id]=iamAct[id]||{a:'',o:'',t:'',st:'Open'};iamAct[id][k]=v;}persist();};
  ctlGroupEvidence=function(dcode,group,on){IAMCTL.filter(c=>c.d===dcode&&c.g===group&&frameworkControlInScope(c)).forEach(c=>{const r=iamGetResponse(iamSelectedObject,c.id);if(r.maturity!==null&&r.implementation!=='na'){const key=iamObjKey(iamSelectedObject,c.id);iamObjResponses[key]=Object.assign(r,{evidence:on?'design':'none',updated:new Date().toISOString()});}});persist();renderControls();};
  ctlNextUnrated=function(){const next=IAMCTL.find(c=>frameworkControlInScope(c)&&iamGetResponse(iamSelectedObject,c.id).maturity===null&&iamGetResponse(iamSelectedObject,c.id).implementation!=='na');if(!next){alert('Every applicable control has a rating for this assessment target.');return;}IAM_DOMAINS.forEach(D=>ctlOpen[D.c]=(D.c===next.d));renderControls();setTimeout(()=>{const el=document.getElementById('ctlrow-'+next.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},60);};
  renderControls=function(){iamControlMode='scoped';if(!iamObject(iamSelectedObject))iamSelectedObject='legacy';const maps=contextualMaps(),save={r:iamR,e:iamEv,n:iamNote,a:iamAct,active:streamMeta.iam.active,mode:iamControlMode};iamR=maps.R;iamEv=maps.E;iamNote=maps.N;iamAct=maps.A;streamMeta.iam.active=true;iamControlMode='legacy';scopedRendering=true;try{replacedControls();}finally{scopedRendering=false;streamMeta.iam.active=save.active;iamR=save.r;iamEv=save.e;iamNote=save.n;iamAct=save.a;iamControlMode='scoped';}const head=document.getElementById('ctl-head');if(head){const mode=head.querySelector('.v9-modebar');if(mode)mode.remove();head.insertAdjacentHTML('afterbegin',scopeRibbon());}decorateRows();};

  iamBuildRiskModel=function(oid,overrides){if(streamActive('iam'))return baseBuildRisk(oid,overrides);const saved=iamObjResponses;iamObjResponses={};let m;try{m=baseBuildRisk(oid,overrides);}finally{iamObjResponses=saved;}m.scopeActive=false;m.assessed=0;m.tested=0;m.confidence='Prior only';return m;};
  renderBayesianRisk=function(){const host=document.getElementById('v9-risk-host');if(!host)return;if(!iamObjects.length)iamObjects=[iamDefaultObject()];if(!iamObject(iamRiskState.objectId))iamRiskState.objectId='legacy';host.innerHTML='<div class="v9-risk-empty-guard"><b>Loading the prior-only Bayesian model…</b>The network remains visible before assessment evidence is entered.</div>';try{baseRenderRisk();if(!streamActive('iam'))host.insertAdjacentHTML('afterbegin','<div class="v9-prior-banner"><b>Prior-only model is visible.</b> IAM is currently disabled, so saved control evidence is excluded from the calculation. Enable IAM in Setup when the assessment begins; the same network will then update from the selected level and named target.</div>');}catch(e){host.innerHTML=`<div class="v9-risk-empty-guard"><b>The Bayesian model could not render.</b>${v9esc(e.message)} · Export the assessment and report this message.</div>`;}};

  globalThis.IOPAF_SCOPE={selectLevel,selectTarget,addTarget,field:(id,k,v)=>writeScoped(id,{[k]:['tested','totalPaths','exceptions'].includes(k)?Math.max(0,Number(v)||0):v}),currentLevel};
  globalThis.IOPAF_V9_API.buildRiskModel=iamBuildRiskModel;
  globalThis.IOPAF_V9_API.scope=globalThis.IOPAF_SCOPE;
  iamControlMode='scoped';if(!iamObject(iamSelectedObject))iamSelectedObject='legacy';if(!iamRiskState.view||iamRiskState.view==='summary')iamRiskState.view='network';
  persist();const current=document.querySelector('.view.on');if(current&&current.id==='view-controls')renderControls();if(current&&current.id==='view-results')renderResults();
})();
</script>
