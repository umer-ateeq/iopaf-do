<style id="iopaf-v9-remediation-actions-styles">
/* Structured remediation ledger: multiple target-specific actions per control. */
.cw-bottom{grid-template-columns:1fr;align-items:start}
.ra-workspace{border:1px solid #cbd9e4;border-top:4px solid #0e8a7d;background:#fff;padding:13px;min-width:0}
.ra-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:11px}
.ra-ey{font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.09em;color:#0e8a7d}
.ra-head h4{margin:3px 0 2px;font-size:16px;color:#0b2e52}.ra-head p{margin:0;font-size:10.5px;line-height:1.45;color:#65798b}
.ra-add{border:1px solid #0e8a7d;background:#0e8a7d;color:#fff;padding:8px 11px;min-height:36px;font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.ra-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.ra-chip{font-family:var(--mono);font-size:8.5px;font-weight:800;padding:4px 7px;background:#eef3f7;color:#526b7f;border:1px solid #d8e2e9}.ra-chip.open{color:#8a3a45;background:#fff2f3;border-color:#eccbd0}.ra-chip.done{color:#0b746a;background:#eaf8f5;border-color:#b5ddd7}.ra-chip.overdue{color:#a1303d;background:#fdebed;border-color:#e7b9bf}
.ra-list{display:grid;gap:9px}.ra-card{border:1px solid #d8e2e9;background:#fbfcfd;box-shadow:inset 4px 0 #0b2e52}.ra-card.completed{box-shadow:inset 4px 0 #0e8a7d}.ra-card.overdue{box-shadow:inset 4px 0 #b42332}
.ra-card-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #e1e8ed}.ra-num{font-family:var(--mono);font-size:9px;font-weight:900;background:#0b2e52;color:#fff;padding:4px 6px}.ra-card.completed .ra-num{background:#0e8a7d}.ra-card-head b{font-size:11px;color:#173c57}.ra-card-head small{font-family:var(--mono);font-size:8px;color:#718394}.ra-actions{margin-left:auto;display:flex;gap:5px}.ra-actions button{border:1px solid #cbd8e1;background:#fff;color:#536a7d;padding:5px 7px;font-size:8.5px;font-weight:800;cursor:pointer}.ra-actions button.danger{color:#a1303d;border-color:#dfbdc2}
.ra-body{padding:10px}.ra-desc label,.ra-field label,.ra-close label{display:block;font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.05em;color:#687c8e;margin-bottom:5px}.ra-desc textarea,.ra-close textarea{width:100%;border:1px solid #cbd8e1;background:#fff;color:#203c55;font-size:12px;line-height:1.5;padding:9px;resize:vertical}.ra-desc textarea{min-height:94px}.ra-close textarea{min-height:62px}
.ra-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:7px;margin:8px 0}.ra-field{border:1px solid #d7e1e8;background:#fff;padding:8px}.ra-field input,.ra-field select{width:100%;border:0;background:transparent;font-size:11px;color:#263f56;outline:none;min-height:25px}.ra-close{border-top:1px solid #e1e8ed;padding-top:8px}.ra-empty{border:1px dashed #a9bdcc;background:#f7fafc;padding:15px;text-align:center;color:#607589;font-size:11px;line-height:1.5}.ra-empty b{display:block;color:#0b2e52;font-size:12px;margin-bottom:3px}
.ra-results{margin-top:18px;border:1px solid #d8e2e9;background:#fff}.ra-results-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px;border-bottom:1px solid #dce5eb}.ra-results-head h3{margin:0;color:#0b2e52;font-size:16px}.ra-results-head p{margin:3px 0 0;color:#687b8d;font-size:10px}.ra-results-head button{border:1px solid #0e8a7d;background:#fff;color:#0b746a;padding:7px 9px;font-size:9.5px;font-weight:800;cursor:pointer}.ra-results-scroll{overflow:auto}.ra-table{width:100%;border-collapse:collapse;min-width:980px}.ra-table th{font-family:var(--mono);font-size:7.8px;letter-spacing:.06em;color:#718394;text-align:left;background:#f5f8fa;padding:8px}.ra-table td{font-size:9.5px;line-height:1.4;padding:8px;border-top:1px solid #e7edf1;vertical-align:top}.ra-table button{border:1px solid #b5d8d3;background:#eff9f7;color:#0b746a;padding:5px 7px;font-size:8.5px;font-weight:800;cursor:pointer}.ra-state{font-family:var(--mono);font-size:8px;font-weight:800;padding:3px 5px;background:#eef3f6;color:#52697c}.ra-state.Completed{background:#e8f7f4;color:#0b746a}.ra-state.Blocked,.ra-state.overdue{background:#fdecef;color:#a1303d}
@media(max-width:1180px){.ra-grid{grid-template-columns:1fr 1fr}.ra-workspace{grid-column:1}}
@media(max-width:700px){.ra-head{flex-direction:column}.ra-add{width:100%}.ra-grid{grid-template-columns:1fr}.ra-card-head{align-items:flex-start;flex-wrap:wrap}.ra-actions{margin-left:0;width:100%}.ra-actions button{flex:1}.ra-desc textarea{min-height:115px}}
</style>
<script>
(()=>{
  const statusValues=['Open','In progress','Blocked','Completed','Risk accepted'];
  const priorityValues=['Critical','High','Medium','Low'];
  let actionSeq=0;
  const safeId=v=>String(v||'').replace(/[^a-zA-Z0-9_-]/g,'');
  const stamp=()=>new Date().toISOString();
  const makeId=()=>`ra-${Date.now().toString(36)}-${(++actionSeq).toString(36)}`;
  function normalizeStatus(v){const s=String(v||'Open').toLowerCase();return s==='done'||s==='completed'?'Completed':s==='progress'||s==='in progress'?'In progress':s==='blocked'?'Blocked':s==='risk accepted'?'Risk accepted':'Open';}
  function rawResponse(oid,cid){const key=iamObjKey(oid,cid);if(!iamObjResponses[key])iamObjResponses[key]=iamResponseTemplate();return iamObjResponses[key];}
  function isLegacyPopulated(r){return !!(r.action||r.owner||r.due||(r.status&&normalizeStatus(r.status)!=='Open'));}
  function legacyAction(oid,cid,r){return {id:`legacy-${safeId(oid)}-${safeId(cid)}`,description:r.action||'',owner:r.owner||'',due:r.due||'',priority:'Medium',status:normalizeStatus(r.status),completionEvidence:'',created:r.updated||stamp(),updated:r.updated||stamp()};}
  function ensureActions(oid,cid){const r=rawResponse(oid,cid);if(!Array.isArray(r.remediationActions)){r.remediationActions=[];if(isLegacyPopulated(r))r.remediationActions.push(legacyAction(oid,cid,r));r.remediationMigrated=true;}return r.remediationActions;}
  function actionHasData(a){return !!(a.description||a.owner||a.due||a.completionEvidence||a.status!=='Open'||a.priority!=='Medium');}
  function syncLegacy(r){const a=(r.remediationActions||[]).find(x=>x.status!=='Completed')||(r.remediationActions||[])[0];r.action=a?a.description||'':'';r.owner=a?a.owner||'':'';r.due=a?a.due||'':'';r.status=a?(a.status==='Completed'?'Done':a.status||'Open'):'Open';}
  function migrateAll(){let changed=false;Object.entries(iamAct||{}).forEach(([cid,a])=>{const r=rawResponse('legacy',cid);if(!r.action&&!r.owner&&!r.due){r.action=a.a||'';r.owner=a.o||'';r.due=a.t||'';r.status=a.st||'Open';}});Object.keys(iamObjResponses).forEach(key=>{const [oid,cid]=key.split('|'),r=rawResponse(oid,cid);if(!Array.isArray(r.remediationActions)){ensureActions(oid,cid);syncLegacy(r);changed=true;}});if(changed)persist();}
  function get(cid){return ensureActions(iamSelectedObject,cid);}
  function find(cid,id){return get(cid).find(a=>a.id===id);}
  function save(cid,rerender=false){const r=rawResponse(iamSelectedObject,cid);syncLegacy(r);r.updated=stamp();if(iamSelectedObject==='legacy')iamAct[cid]={a:r.action||'',o:r.owner||'',t:r.due||'',st:r.status||'Open'};persist();if(rerender)renderControls();else updateSummary(cid);}
  function add(cid){const list=get(cid);if(list.length&&list.some(a=>!actionHasData(a))){const blank=list.find(a=>!actionHasData(a));const el=document.getElementById(`ra-desc-${blank.id}`);if(el)el.focus();return;}const now=stamp();list.push({id:makeId(),description:'',owner:'',due:'',priority:'Medium',status:'Open',completionEvidence:'',created:now,updated:now});save(cid,true);setTimeout(()=>{const el=document.querySelector('.ra-card:last-child textarea');if(el)el.focus();},40);}
  function update(cid,id,field,value){const a=find(cid,id);if(!a)return;a[field]=value;a.updated=stamp();save(cid,false);}
  function remove(cid,id){const a=find(cid,id);if(!a)return;if(actionHasData(a)&&!confirm('Delete this remedial action and its completion evidence?'))return;const r=rawResponse(iamSelectedObject,cid);r.remediationActions=get(cid).filter(x=>x.id!==id);save(cid,true);}
  function duplicate(cid,id){const a=find(cid,id);if(!a)return;const now=stamp(),copy=Object.assign({},a,{id:makeId(),status:'Open',completionEvidence:'',created:now,updated:now});get(cid).push(copy);save(cid,true);}
  function complete(cid,id){const a=find(cid,id);if(!a)return;a.status='Completed';a.updated=stamp();save(cid,true);}
  function counts(list){const today=new Date().toISOString().slice(0,10),overdue=list.filter(a=>a.due&&a.due<today&&!['Completed','Risk accepted'].includes(a.status)).length,done=list.filter(a=>a.status==='Completed').length,open=list.length-done;return {open,done,overdue};}
  function updateSummary(cid){const host=document.querySelector('.ra-workspace');if(!host)return;const c=counts(get(cid));host.querySelectorAll('[data-ra-count]').forEach(el=>{el.textContent=c[el.dataset.raCount]||0;});}
  function options(values,current){return values.map(v=>`<option ${v===current?'selected':''}>${v}</option>`).join('');}
  function card(cid,a,i){const today=new Date().toISOString().slice(0,10),overdue=a.due&&a.due<today&&!['Completed','Risk accepted'].includes(a.status),cls=a.status==='Completed'?'completed':overdue?'overdue':'';return `<article class="ra-card ${cls}" data-action-id="${a.id}"><div class="ra-card-head"><span class="ra-num">A${String(i+1).padStart(2,'0')}</span><div><b>${a.description?v9esc(a.description.slice(0,72)):'New remedial action'}</b><small>${overdue?'OVERDUE · ':''}${a.updated?'UPDATED '+v9esc(a.updated.slice(0,10)):'NOT YET SAVED'}</small></div><div class="ra-actions"><button type="button" onclick="IOPAF_REMEDIATION.duplicate('${cid}','${a.id}')">Duplicate</button>${a.status==='Completed'?'':`<button type="button" onclick="IOPAF_REMEDIATION.complete('${cid}','${a.id}')">Mark complete</button>`}<button type="button" class="danger" onclick="IOPAF_REMEDIATION.remove('${cid}','${a.id}')">Delete</button></div></div><div class="ra-body"><div class="ra-desc"><label for="ra-desc-${a.id}">REMEDIAL ACTION DESCRIPTION</label><textarea id="ra-desc-${a.id}" rows="4" placeholder="Describe the gap, the change required, the affected scope and the acceptance criterion." oninput="IOPAF_REMEDIATION.update('${cid}','${a.id}','description',this.value)">${v9esc(a.description||'')}</textarea></div><div class="ra-grid"><div class="ra-field"><label>ACCOUNTABLE OWNER</label><input value="${v9esc(a.owner||'')}" placeholder="Person, team or role" oninput="IOPAF_REMEDIATION.update('${cid}','${a.id}','owner',this.value)"></div><div class="ra-field"><label>DUE DATE</label><input type="date" value="${v9esc(a.due||'')}" onchange="IOPAF_REMEDIATION.update('${cid}','${a.id}','due',this.value)"></div><div class="ra-field"><label>PRIORITY</label><select onchange="IOPAF_REMEDIATION.update('${cid}','${a.id}','priority',this.value)">${options(priorityValues,a.priority||'Medium')}</select></div><div class="ra-field"><label>STATUS</label><select onchange="IOPAF_REMEDIATION.update('${cid}','${a.id}','status',this.value)">${options(statusValues,a.status||'Open')}</select></div></div><div class="ra-close"><label>COMPLETION EVIDENCE / ACCEPTANCE REFERENCE</label><textarea rows="2" placeholder="Closure test, ticket, approval, evidence location or residual-risk acceptance." oninput="IOPAF_REMEDIATION.update('${cid}','${a.id}','completionEvidence',this.value)">${v9esc(a.completionEvidence||'')}</textarea></div></div></article>`;}
  function workspace(cid){const list=get(cid),c=counts(list);return `<section class="ra-workspace"><div class="ra-head"><div><div class="ra-ey">4 · STRUCTURED REMEDIATION LEDGER</div><h4>Remedial actions for this control and target</h4><p>Record separate actions when ownership, due date, priority or closure evidence differs.</p></div><button type="button" class="ra-add" onclick="IOPAF_REMEDIATION.add('${cid}')">+ Add remedial action</button></div><div class="ra-summary"><span class="ra-chip open"><b data-ra-count="open">${c.open}</b> open</span><span class="ra-chip overdue"><b data-ra-count="overdue">${c.overdue}</b> overdue</span><span class="ra-chip done"><b data-ra-count="done">${c.done}</b> completed</span><span class="ra-chip">${v9esc(iamObject(iamSelectedObject).name)}</span></div><div class="ra-list">${list.length?list.map((a,i)=>card(cid,a,i)).join(''):`<div class="ra-empty"><b>No remedial action recorded.</b>Add one action for each independently owned or scheduled correction.</div>`}</div></section>`;}
  function decorate(){const ui=iamRiskState.controlsUI||{},cid=ui.control||iamSelectedControl;if(!cid||!iamCtl(cid))return;const bottom=document.querySelector('.cw-bottom');if(!bottom)return;const old=[...bottom.children].find(x=>x.querySelector&&x.querySelector('.cw-action-grid'));if(old)old.outerHTML=workspace(cid);else if(!bottom.querySelector('.ra-workspace'))bottom.insertAdjacentHTML('beforeend',workspace(cid));}
  function allRows(){const rows=[];Object.keys(iamObjResponses).forEach(key=>{const split=key.indexOf('|'),oid=key.slice(0,split),cid=key.slice(split+1),c=iamCtl(cid),o=iamObject(oid);if(!c||!o)return;ensureActions(oid,cid).forEach(a=>{if(actionHasData(a))rows.push({oid,cid,c,o,a});});});return rows.sort((x,y)=>(x.a.status==='Completed')-(y.a.status==='Completed')||String(x.a.due||'9999').localeCompare(String(y.a.due||'9999')));}
  function openControl(oid,cid){iamSelectedObject=oid;iamSelectedControl=cid;iamRiskState.objectId=oid;iamRiskState.controlsUI=Object.assign(iamRiskState.controlsUI||{},{view:'focus',domain:cid.slice(0,2),control:cid});persist();go('controls');renderControls();}
  function csv(){const rows=[['Action ID','Control ID','Control','Assessment object','Object type','Description','Owner','Priority','Due','Status','Completion evidence','Created','Updated']];allRows().forEach(x=>rows.push([x.a.id,x.cid,x.c.s,x.o.name,iamObjectType(x.o.type).name,x.a.description,x.a.owner,x.a.priority,x.a.due,x.a.status,x.a.completionEvidence,x.a.created,x.a.updated]));const text=rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n'),b=new Blob([text],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='IOPAF-IAM-remedial-actions.csv';a.click();URL.revokeObjectURL(u);}
  function renderRegister(){const panel=document.getElementById('panel-actions');if(!panel)return;let host=document.getElementById('iam-remediation-register');if(!host){host=document.createElement('section');host.id='iam-remediation-register';host.className='ra-results';panel.appendChild(host);}const rows=allRows(),c=counts(rows.map(x=>x.a));host.innerHTML=`<div class="ra-results-head"><div><h3>IAM structured remedial actions</h3><p>${rows.length} actions across assessment objects · ${c.open} open · ${c.overdue} overdue · ${c.done} completed</p></div><button type="button" onclick="IOPAF_REMEDIATION.exportCSV()">Export actions CSV</button></div><div class="ra-results-scroll"><table class="ra-table"><thead><tr><th>CONTROL / TARGET</th><th>ACTION</th><th>OWNER</th><th>PRIORITY</th><th>DUE</th><th>STATUS</th><th>COMPLETION EVIDENCE</th><th></th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${x.cid} · ${v9esc(x.c.s)}</b><br>${v9esc(x.o.name)}</td><td>${v9esc(x.a.description||'—')}</td><td>${v9esc(x.a.owner||'—')}</td><td>${v9esc(x.a.priority||'Medium')}</td><td>${v9esc(x.a.due||'—')}</td><td><span class="ra-state ${x.a.status==='Completed'?'Completed':x.a.status==='Blocked'?'Blocked':''}">${v9esc(x.a.status)}</span></td><td>${v9esc(x.a.completionEvidence||'—')}</td><td><button type="button" onclick="IOPAF_REMEDIATION.open('${x.oid}','${x.cid}')">Open control</button></td></tr>`).join(''):'<tr><td colspan="8" style="padding:18px;text-align:center;color:#687b8d">No IAM remedial actions have been recorded.</td></tr>'}</tbody></table></div>`;}
  function renderReportLink(){const panel=document.getElementById('panel-reports');if(!panel)return;let host=document.getElementById('rep-iam-remediation');if(!host){host=document.createElement('section');host.id='rep-iam-remediation';host.className='ra-results';panel.appendChild(host);}const rows=allRows();host.innerHTML=`<div class="ra-results-head"><div><h3>IAM remedial-action register</h3><p>One auditable CSV row per target-specific action, including priority, lifecycle status and completion evidence. ${rows.length} action${rows.length===1?'':'s'} currently recorded.</p></div><button type="button" onclick="IOPAF_REMEDIATION.exportCSV()">Download actions CSV</button></div>`;}
  migrateAll();
  const baseRenderControls=renderControls;renderControls=function(){baseRenderControls();decorate();};
  const baseRenderActions=renderActions;renderActions=function(){baseRenderActions();renderRegister();};
  const baseRenderReports=renderReports;renderReports=function(){baseRenderReports();renderReportLink();};
  const baseResTab=resTab;resTab=function(btn){baseResTab(btn);if(btn&&btn.dataset.panel==='panel-actions')renderRegister();if(btn&&btn.dataset.panel==='panel-reports')renderReportLink();};
  globalThis.IOPAF_REMEDIATION={add,update,remove,duplicate,complete,open:openControl,exportCSV:csv,rows:allRows,ensure:ensureActions,compatibilityMirror:syncLegacy,renderRegister,renderReportLink};
  const current=document.querySelector('.view.on');if(current&&current.id==='view-controls')renderControls();if(current&&current.id==='view-results')renderRegister();
})();
</script>
