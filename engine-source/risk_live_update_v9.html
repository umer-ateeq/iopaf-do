<script>
(()=>{

    {id:'RSK-GOV-01',domain:'D1',name:'Governance drift creates uncontrolled access',inherent:[8,22,43,22,5]},

  const scenarioById=id=>scenarios.find(s=>s.id===id)||scenarios[0];

  function assessed(r){return !!r&&r.implementation!=='na'&&(r.maturity!==null||r.evidence!=='none'||r.tested>0||r.exceptions>0||!['not-tested',''].includes(r.implementation));}
  function sourceFor(c,oid,override){if(override)return oid;const obj=iamObject(oid),direct=iamGetResponse(oid,c.id);if(direct.implementation==='na'||assessed(direct))return oid;if(c.d==='D1'&&oid!=='legacy'&&assessed(iamGetResponse('legacy',c.id)))return 'legacy';const shared=iamObjects.find(o=>o.type==='iam'&&!o.legacy);if(shared&&iamControlApplies(c,shared)&&assessed(iamGetResponse(shared.id,c.id)))return shared.id;return oid;}
  function taxonomyFor(c){return (globalThis.IOPAF_CONTROL_TAXONOMY&&IOPAF_CONTROL_TAXONOMY.controls&&IOPAF_CONTROL_TAXONOMY.controls[c.id])||{};}

  function effectFor(c){const e=taxonomyFor(c).effect;return e==='Consequence'?'consequence':e==='Both'?'both':'likelihood';}
  function shiftDown(dist,delta){const out=Array(dist.length).fill(0),d=Math.max(0,Number(delta)||0);dist.forEach((p,i)=>{const target=Math.max(0,i-d),lo=Math.floor(target),hi=Math.min(dist.length-1,Math.ceil(target)),f=target-lo;out[lo]+=p*(1-f);out[hi]+=p*f;});return v9roundPct(out);}
  function roundGroup(values,total){const sum=values.reduce((a,b)=>a+b,0);if(!sum)return values.map(()=>0);const raw=values.map(v=>v*total/sum),out=raw.map(Math.floor);let left=total-out.reduce((a,b)=>a+b,0);raw.map((v,i)=>({i,f:v-Math.floor(v)})).sort((a,b)=>b.f-a.f||a.i-b.i).slice(0,left).forEach(x=>out[x.i]++);return out;}
  function riskCrossAudited(like,impact){const raw=[0,0,0,0,0,0];for(let l=0;l<5;l++)for(let i=0;i<5;i++){const idx=v9clamp(Math.round((l*1.15+i*1.25)/1.55),0,5);raw[idx]+=like[l]*impact[i]/100;}const high=Math.round(raw.slice(3).reduce((a,b)=>a+b,0));return [...roundGroup(raw.slice(0,3),100-high),...roundGroup(raw.slice(3),high)];}
  function available(obj){return scenarios.filter(s=>s.domain==='D1'||IAMCTL.some(c=>c.d===s.domain&&iamControlApplies(c,obj)));}
  function build(oid,overrides,scenarioId){

    controls.forEach(c=>{const src=sourceFor(c,obj.id,overrides&&overrides[c.id]),p=iamEffectiveness(src,c.id,overrides&&overrides[c.id]);p.sourceObjectId=src;effects[c.id]=p;(groupMap[c.g]||(groupMap[c.g]=[])).push({c,p,role:roleFor(c),effect:effectFor(c)});});

    const groups=Object.entries(groupMap).map(([name,all])=>{const items=all.filter(x=>x.p.r.implementation!=='na'),weight=items.reduce((a,x)=>a+(Number(x.c.w)||1),0),mean=weight?items.reduce((a,x)=>a+controlValue(x)*(Number(x.c.w)||1),0)/weight:0,roles=[...new Set(items.map(x=>x.role))],effectsForGroup=[...new Set(items.map(x=>x.effect))],dist=v9ordinalDist(mean*4,.74);return {name,items,mean,dist,role:roles.length===1?roles[0]:'mixed',roles,effects:effectsForGroup,assessed:items.filter(x=>assessed(x.p.r)).length,tested:items.filter(x=>x.p.r.tested>0).length};});

    return {obj,s,effects,groups,controlsCount:activeItems.length,mappedControlCount:controls.length,excluded,prevent,basePrevent,detect,likelihoodControlEffectiveness:prevent,consequenceControlEffectiveness:detect,commonCauseDist:sharedDist,sharedEff,commonCauseSource:sharedHasEvidence?shared.name:'Provisional shared-service template',inh,like,impact,risk,appetite,appetiteLimit,appetiteBreached:appetiteLimit===null?null:appetite>appetiteLimit,assessed:assessedCount,tested,inhProb:(inh[3]+inh[4])/100,likeProb:(like[3]+like[4])/100,scopeActive:active,whatIf:!active&&assessedCount>0,confidence:tested>=Math.max(3,Math.ceil(activeItems.length*.25))?'High':tested>=2?'Medium':assessedCount?'Low':'Prior only'};
  }
  function stateBanner(m){const cls=m.whatIf?'whatif':m.assessed?'':'prior',state=m.whatIf?'WHAT-IF · IAM STREAM DISABLED':m.assessed?'LIVE ASSESSMENT EVIDENCE':'PRIOR ONLY',last=iamRiskState.lastCalculated?new Date(iamRiskState.lastCalculated).toLocaleString():'Not yet updated';return `<div class="risk-live-state ${cls}"><b>${state}.</b> ${m.assessed}/${m.controlsCount} mapped controls assessed for ${v9esc(m.obj.name)}. <code>LAST CALCULATED · ${v9esc(last)}</code>${m.whatIf?' Enable IAM in Setup before treating this as an official assessment result.':''}</div>`;}
  function head(m){const opts=available(m.obj);return `<div class="v9-risk-head"><span class="v9-cid">${m.s.id}</span><select onchange="iamRiskState.scenario=this.value;iamRiskState.lastCalculated=new Date().toISOString();persist();renderBayesianRisk()">${opts.map(s=>`<option value="${s.id}" ${s.id===m.s.id?'selected':''}>${v9esc(s.name)}</option>`).join('')}</select><select onchange="iamRiskState.objectId=this.value;iamRiskState.lastCalculated=new Date().toISOString();persist();renderBayesianRisk()">${iamObjects.map(o=>`<option value="${o.id}" ${o.id===m.obj.id?'selected':''}>${v9esc(o.name)}</option>`).join('')}</select><span class="tag">MODEL v0.4 · ${m.confidence.toUpperCase()} CONFIDENCE</span><span class="right">${v9esc(m.obj.criticality||'T2')} · ${v9esc(iamObjectType(m.obj.type).name)}</span></div>`;}
  function summary(m){const oldHead=iamRiskHead,oldBuild=iamBuildRiskModel;iamRiskHead=()=>head(m);iamBuildRiskModel=(oid,overrides)=>build(oid,overrides,m.s.id);let html;try{html=iamRiskSummary(m);}finally{iamRiskHead=oldHead;iamBuildRiskModel=oldBuild;}const temp=document.createElement('div');temp.innerHTML=html;temp.querySelectorAll('.v9-sens').forEach((el,i)=>{if(i>=8)el.remove();});const warn=temp.querySelector('.v9-warning b');if(warn)warn.textContent=m.assessed?`${m.assessed} of ${m.controlsCount} mapped controls assessed.`:`Prior-only result — ${m.controlsCount} mapped controls are not yet assessed.`;return stateBanner(m)+temp.innerHTML;}
  function groupNode(g){return `<div class="risk-map-node assurance"><label>${g.role.toUpperCase()} CONTROL GROUP</label><b>${v9esc(g.name)}</b><small>${g.assessed}/${g.items.length} assessed · ${g.tested} tested</small>${iamObjDistHTML(g.dist)}</div>`;}
  function riskDist(dist){return `<div class="v9-riskdist" style="margin-top:6px">${dist.map((v,i)=>`<span style="width:${v}%;background:${IAM_RISK_COL[i]}">${v>=7?v:''}</span>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(6,1fr);font-family:var(--mono);font-size:6.5px;color:#718395">${IAM_RISK_LABELS.map(x=>`<span>${v9esc(x)}</span>`).join('')}</div>`;}
  function network(m){const riskMode=m.risk.indexOf(Math.max(...m.risk)),impactMode=m.impact.indexOf(Math.max(...m.impact));return `${head(m)}${stateBanner(m)}<div class="v9-warning"><b>Live Bayesian trace:</b> every control in ${m.s.domain} feeds its control-group node. Group effectiveness updates the scenario likelihood and consequence distributions; these converge into residual risk.</div><div class="risk-live-scroll"><div class="risk-map"><div class="risk-map-col"><div class="risk-map-node"><label>THREAT OPPORTUNITY</label><b>${v9esc(m.s.name)}</b><small>Scenario-specific provisional prior</small>${iamObjDistHTML(m.inh)}</div><div class="risk-map-node"><label>SHARED DEPENDENCY</label><b>${v9esc(m.commonCauseSource)}</b><small>Common identity-provider influence</small>${iamObjDistHTML(m.commonCauseDist)}</div></div><div class="risk-map-arrow">→</div><div class="risk-group-grid">${m.groups.map(groupNode).join('')}</div><div class="risk-map-arrow">→</div><div class="risk-map-col"><div class="risk-map-node assurance"><label>PREVENTIVE BARRIER</label><b>${Math.round(m.prevent*100)}% effectiveness</b><small>Dependency-adjusted aggregate</small>${iamObjDistHTML(v9ordinalDist(m.prevent*4,.72))}</div><div class="risk-map-node assurance"><label>DETECTION / RESPONSE</label><b>${Math.round(m.detect*100)}% effectiveness</b><small>Detective-group aggregate</small>${iamObjDistHTML(v9ordinalDist(m.detect*4,.72))}</div></div><div class="risk-map-arrow">→</div><div class="risk-map-col"><div class="risk-map-node"><label>EVENT LIKELIHOOD</label><b>${Math.round(m.likeProb*100)}% likely or above</b>${iamObjDistHTML(m.like)}</div><div class="risk-map-node"><label>CONSEQUENCE</label><b>${['Insignificant','Minor','Moderate','Major','Severe'][impactMode]}</b>${iamObjDistHTML(m.impact)}</div></div><div class="risk-map-arrow">→</div><div class="risk-map-node risk"><label>RESIDUAL RISK POSTERIOR</label><b>${IAM_RISK_LABELS[riskMode]}</b><small>${m.appetite}% probability of High or above</sm   function auditedView(html,m,view){const temp=document.createElement('div');temp.innerHTML=html;const tag=temp.querySelector('.v9-risk-head .tag');if(tag)tag.textContent=`MODEL v0.5 · AUDITED · ${m.confidence.toUpperCase()} CONFIDENCE`;if(view==='summary'){const kpi=[...temp.querySelectorAll('.v9-kpi')].find(x=>/APPETITE EXCEEDANCE/.test(x.textContent));if(kpi){kpi.classList.remove('red');kpi.classList.add('teal');const label=kpi.querySelector('label'),span=kpi.querySelector('span');if(label)label.textContent='P(RISK ≥ HIGH)';if(span)span.textContent=m.appetiteLimit===null?'No approved appetite limit':`Approved limit ${m.appetiteLimit}%`;}const box=temp.querySelector('.v9-appetite');if(box){box.style.borderLeftColor='#0e8a7d';box.style.background='#eff9f7';box.style.color='#315f61';box.innerHTML=`<b style="color:#0e746a">Risk-distribution tail</b>P(Risk ≥ High) is ${m.appetite}%. ${m.appetiteLimit===null?'No approved organizational appetite limit is configured; no breach decision is made.':`Approved limit is ${m.appetiteLimit}% — ${m.appetiteBreached?'exceeded':'not exceeded'}.`}`;}}if(view==='network'){const nodes=[...temp.querySelectorAll('.risk-map-node.assurance')];nodes.forEach(n=>{const label=n.querySelector('label');if(!label)return;if(label.textContent==='PREVENTIVE BARRIER')label.textContent='LIKELIHOOD CONTROLS';if(label.textContent==='DETECTION / RESPONSE')label.textContent='CONSEQUENCE CONTROLS';});const riskSmall=temp.querySelector('.risk-map-node.risk small');if(riskSmall)riskSmall.textContent=`P(Risk ≥ High) ${m.appetite}% · ${m.appetiteLimit===null?'limit not configured':`limit ${m.appetiteLimit}%`}`;const warning=temp.querySelector('.v9-warning');if(warning)warning.innerHTML=`<b>Audited Bayesian trace:</b> formally classified control effects update likelihood and consequence separately. Unassessed controls provide no risk reduction; N/A controls are excluded. Provisional influence coefficients remain subject to calibration.`;}if(view==='evidence'){
